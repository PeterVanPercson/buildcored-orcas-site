<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" width="1600" height="1200" class="orcas-v3-svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;display=swap');
.bg{fill:#0b0d10}
.lbl{font-family:"Geist Mono",ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:5px;text-transform:uppercase;fill:#898f97}
.dot{fill:#6ee2a1}
.win{fill:#101317;stroke:#2a2f37;stroke-width:1.5}
.bar{fill:#171b21}
.mono{font-family:"Geist Mono",ui-monospace,Menlo,monospace;font-size:30px;fill:#c4cad1}
.pr{fill:#6ee2a1}.us{fill:#d6dee0}.dim{fill:#585d64}
.tag{font-family:"Geist Mono",monospace;font-size:18px;letter-spacing:2px;fill:#6ee2a1;text-transform:uppercase}
.pulse{animation:k-pulse 2.4s ease-in-out infinite}@keyframes k-pulse{0%,100%{opacity:.35}50%{opacity:1}}
.l1{opacity:0;animation:k-app 7s ease-out infinite}
.l2{opacity:0;animation:k-app 7s ease-out .9s infinite}
.l3{opacity:0;animation:k-app 7s ease-out 1.7s infinite}
.l4{opacity:0;animation:k-app 7s ease-out 2.3s infinite}
.l5{opacity:0;animation:k-app 7s ease-out 2.9s infinite}
.l6{opacity:0;animation:k-app 7s ease-out 3.5s infinite}
@keyframes k-app{0%,6%{opacity:0}12%,88%{opacity:1}97%,100%{opacity:0}}
.cur{animation:k-cur 1s steps(1) infinite}@keyframes k-cur{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>
<rect class="bg" width="1600" height="1200"/>
<circle class="dot pulse" cx="70" cy="74" r="7"/>
<text class="lbl" x="98" y="82">Local AI · offline</text>
<text class="lbl" x="1530" y="82" text-anchor="end">No internet</text>
<circle class="dot pulse" cx="1556" cy="74" r="7"/>

<!-- terminal window -->
<g transform="translate(160 200)">
  <rect class="win" x="0" y="0" width="1280" height="800" rx="18"/>
  <rect class="bar" x="0" y="0" width="1280" height="60" rx="18"/>
  <rect class="bar" x="0" y="30" width="1280" height="30"/>
  <circle cx="40" cy="30" r="9" fill="#ef7878"/><circle cx="74" cy="30" r="9" fill="#f0b966"/><circle cx="108" cy="30" r="9" fill="#6ee2a1"/>
  <text class="mono dim" x="640" y="38" font-size="20" text-anchor="middle">pocketagent · zsh · 80×24</text>
  <rect x="1140" y="16" width="110" height="28" rx="14" fill="none" stroke="#2f5f47"/>
  <circle cx="1162" cy="30" r="5" fill="#6ee2a1"/><text x="1178" y="36" class="tag" font-size="14">OFFLINE</text>

  <!-- body: each line on its own baseline, 44px apart — no overlap by construction -->
  <g transform="translate(48 124)">
    <text class="mono"><tspan class="pr">~/agent $</tspan> <tspan class="us">./pa --local</tspan></text>
    <text class="mono us l1" y="88">&gt; what's a closure?</text>
    <text class="mono l2" y="176">A closure pairs a function with the</text>
    <text class="mono l3" y="220">scope it was defined in — those</text>
    <text class="mono l4" y="264">variables stay reachable even after</text>
    <text class="mono l5" y="308">that scope has otherwise ended.</text>
    <text class="mono l6" y="404"><tspan class="pr">~/agent $</tspan> <tspan class="us cur">▋</tspan></text>
  </g>
</g>
<text class="tag" x="160" y="1110" fill="#585d64" letter-spacing="3">model runs on-device · 0 tokens billed</text>
</svg>
