<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" width="1600" height="1200" class="orcas-v3-svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;family=Bricolage+Grotesque:wght@700&amp;display=swap');
.bg{fill:#0b0d10}
.lbl{font-family:"Geist Mono",ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:5px;text-transform:uppercase;fill:#898f97}
.dot{fill:#6ee2a1}
.fig{stroke:#f4f6f8;stroke-width:14;stroke-linecap:round;fill:none}
.flag{stroke:#d6dee0;stroke-width:13;stroke-linecap:round}
.read{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;fill:#f4f6f8}
.cap{font-family:"Geist Mono",monospace;font-size:20px;letter-spacing:3px;fill:#585d64;text-transform:uppercase}
.poseG{animation:k-pa 5.4s steps(1) infinite}@keyframes k-pa{0%,30%{opacity:1}33%,100%{opacity:0}}
.poseH{animation:k-pb 5.4s steps(1) infinite}@keyframes k-pb{0%,30%{opacity:0}33%,63%{opacity:1}66%,100%{opacity:0}}
.poseI{animation:k-pc 5.4s steps(1) infinite}@keyframes k-pc{0%,63%{opacity:0}66%,96%{opacity:1}99%,100%{opacity:0}}
.glyphA{animation:k-ga 5.4s steps(1) infinite}@keyframes k-ga{0%,30%{opacity:1}33%,100%{opacity:.12}}
.glyphH{animation:k-gb 5.4s steps(1) infinite}@keyframes k-gb{0%,30%{opacity:.12}33%,63%{opacity:1}66%,100%{opacity:.12}}
.glyphI{animation:k-gc 5.4s steps(1) infinite}@keyframes k-gc{0%,63%{opacity:.12}66%,96%{opacity:1}99%,100%{opacity:.12}}
.pulse{animation:k-pulse 2.4s ease-in-out infinite}@keyframes k-pulse{0%,100%{opacity:.35}50%{opacity:1}}
.brk{stroke:#363a40;stroke-width:1.5;stroke-dasharray:6 8}
</style>
<rect class="bg" width="1600" height="1200"/>
<circle class="dot pulse" cx="70" cy="74" r="7"/>
<text class="lbl" x="98" y="82">Pose · semaphore</text>
<text class="lbl" x="1232" y="82" text-anchor="end">Decode</text>
<circle class="dot pulse" cx="1262" cy="74" r="7"/>

<g transform="translate(560 340)">
  <circle cx="0" cy="0" r="46" class="fig"/>
  <path class="fig" d="M0 46 L0 320 M0 320 L-92 478 M0 320 L92 478"/>
  <g class="poseG">
    <path class="flag" d="M0 150 L-186 318"/><rect x="-258" y="290" width="80" height="58" rx="6" fill="#6ee2a1"/>
    <path class="flag" d="M0 150 L186 318"/><rect x="178" y="290" width="80" height="58" rx="6" fill="#d6dee0"/>
  </g>
  <g class="poseH">
    <path class="flag" d="M0 150 L-176 6"/><rect x="-250" y="-26" width="80" height="58" rx="6" fill="#6ee2a1"/>
    <path class="flag" d="M0 150 L206 150"/><rect x="200" y="121" width="80" height="58" rx="6" fill="#d6dee0"/>
  </g>
  <g class="poseI">
    <path class="flag" d="M0 150 L-154 -44"/><rect x="-228" y="-76" width="80" height="58" rx="6" fill="#6ee2a1"/>
    <path class="flag" d="M0 150 L154 -44"/><rect x="148" y="-76" width="80" height="58" rx="6" fill="#d6dee0"/>
  </g>
</g>

<g transform="translate(1040 460)">
  <rect x="0" y="0" width="440" height="280" rx="16" fill="#12151a" stroke="#363a40" stroke-width="1.5"/>
  <text class="cap" x="34" y="60">Decoded</text>
  <line class="brk" x1="34" y1="84" x2="406" y2="84"/>
  <g transform="translate(220 210)">
    <text class="read glyphA" x="0" y="0" font-size="160" text-anchor="middle">H</text>
    <text class="read glyphH" x="0" y="0" font-size="160" text-anchor="middle">I</text>
    <text class="read glyphI" x="0" y="0" font-size="160" text-anchor="middle">!</text>
  </g>
</g>
<text class="cap" x="98" y="1132">Hands → letters · live</text>
</svg>
