<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" class="orcas-v3-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1600 1200"><style>@import url(&apos;/fonts.css&apos;);

    .orcas-v3-svg { display: block; width: 100%; height: 100%; }
    .orcas-v3-svg * { transform-box: fill-box; }

    /* ── motion primitives ──────────────────────────────────────── */
    @keyframes k-fade        { 0%,15%   { opacity: 0 } 30%,75% { opacity: 1 } 90%,100% { opacity: 0 } }
    @keyframes k-fade-in     { 0%       { opacity: 0 } 35%,100% { opacity: 1 } }
    @keyframes k-fade-loop   { 0%,30%   { opacity: 0 } 50%,80% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes k-blink       { 0%,90%,100% { opacity: 1 } 95% { opacity: 0 } }
    @keyframes k-cursor      { 0%,49%   { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes k-pulse       { 0%,100%  { opacity: .25 } 50% { opacity: 1 } }
    @keyframes k-pulse-soft  { 0%,100%  { opacity: .5  } 50% { opacity: 1 } }
    @keyframes k-glow        { 0%,100%  { opacity: .15 } 50% { opacity: .9 } }
    @keyframes k-trace       { 0% { stroke-dashoffset: var(--len,1000) } 60%,100% { stroke-dashoffset: 0 } }
    @keyframes k-trace-loop  { 0%   { stroke-dashoffset: var(--len,1000); opacity: 1 }
                               55%  { stroke-dashoffset: 0; opacity: 1 }
                               92%  { opacity: 1 }
                               100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes k-amp         { 0%,100% { transform: scaleY(.25) } 50% { transform: scaleY(1.2) } }
    @keyframes k-tap         { 0%,100% { transform: scale(1) }    50% { transform: scale(1.18) } }
    @keyframes k-shutter     { 0%,88%,100% { opacity: 0 } 92%,96% { opacity: 1 } }
    @keyframes k-stagger-up  { 0%,15% { opacity: 0; transform: translateY(16px) }
                               30%,75% { opacity: 1; transform: translateY(0) }
                               92%,100% { opacity: 0; transform: translateY(-12px) } }
    @keyframes k-stagger-r   { 0%,15% { opacity: 0; transform: translateX(-12px) }
                               30%,80% { opacity: 1; transform: translateX(0) }
                               95%,100% { opacity: 0; transform: translateX(8px) } }
    @keyframes k-tilt        { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(22deg) } 100% { transform: rotate(0) } }
    @keyframes k-tilt-r      { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(-18deg) } 100% { transform: rotate(0) } }
    @keyframes k-sweep-x     { 0% { transform: translateX(0) } 100% { transform: translateX(var(--dx,40px)) } }
    @keyframes k-sweep-y     { 0% { transform: translateY(0) } 100% { transform: translateY(var(--dy,40px)) } }
    @keyframes k-bob         { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    @keyframes k-breath      { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
    @keyframes k-spin        { from { transform: rotate(0) } to { transform: rotate(360deg) } }
    @keyframes k-ripple      { 0% { opacity: 1; transform: scale(.3) } 100% { opacity: 0; transform: scale(2.3) } }
    @keyframes k-zoom-out    { 0% { opacity: 1; transform: scale(.2) } 100% { opacity: 0; transform: scale(1.6) } }
    @keyframes k-march       { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -40 } }
    @keyframes k-flow        { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -200 } }
    @keyframes k-shake       { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-3px) } 75% { transform: translateX(3px) } }
    @keyframes k-walkbar     { 0%,100% { transform: scaleX(0) } 50%,80% { transform: scaleX(1) } }
    @keyframes k-fill-l-to-r { 0% { transform: scaleX(0) } 100% { transform: scaleX(1) } }.s03 .fist  { animation: s03-fist 3.5s cubic-bezier(0.16, 1, 0.3, 1) infinite; transform-origin: 50% 100%; }
        .s03 .level { animation: s03-level 3.5s cubic-bezier(0.16, 1, 0.3, 1) infinite; transform-origin: 0 50%; }
        .s03 .num   { animation: s03-num 3.5s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
        @keyframes s03-fist  { 0%,100% { transform: translateY(280px) } 50% { transform: translateY(0) } }
        @keyframes s03-level { 0%,100% { transform: scaleX(0.18) } 50% { transform: scaleX(0.92) } }
        @keyframes s03-num   { 0%,100% { opacity: 0.4 } 50% { opacity: 1 } }</style><defs><radialGradient id="of3-vign" cx="50%" cy="55%" r="75%"><stop offset="55%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.45)"/></radialGradient><radialGradient id="of3-top" cx="50%" cy="0%" r="60%"><stop offset="0%" stop-color="rgba(214,222,224,0.05)"/><stop offset="100%" stop-color="rgba(214,222,224,0)"/></radialGradient><pattern id="of3-hatch" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" x2="0" y1="0" y2="16" stroke="rgba(255,255,255,0.024)" stroke-width="1"/></pattern></defs><rect width="1600" height="1200" fill="#181c22"/><rect width="1600" height="1200" fill="url(#of3-hatch)"/><rect width="1600" height="1200" fill="url(#of3-top)"/><rect width="1600" height="1200" fill="url(#of3-vign)"/><rect width="1598" height="1198" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/><g class="s03"><g transform="translate(80 120)"><circle cx="0" cy="0" r="6" fill="#d6dee0"/><text x="20" y="6" fill="#898f97" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3">HAND · y-position</text></g><g transform="translate(680 120)"><circle cx="0" cy="0" r="6" fill="#d6dee0"/><text x="20" y="6" fill="#898f97" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3">VOLUME</text></g><g transform="translate(360 280)"><line x1="0" x2="0" y1="0" y2="640" stroke="#363a40" stroke-dasharray="2 8" stroke-width="2"/><g class="fist"><rect width="180" height="120" x="-90" y="-40" fill="#12151a" stroke="#d6dee0" stroke-width="4" rx="56"/><circle cx="-50" cy="-32" r="14" fill="none" stroke="#d6dee0" stroke-width="4"/><circle cx="-15" cy="-32" r="14" fill="none" stroke="#d6dee0" stroke-width="4"/><circle cx="20" cy="-32" r="14" fill="none" stroke="#d6dee0" stroke-width="4"/><circle cx="55" cy="-32" r="14" fill="none" stroke="#d6dee0" stroke-width="4"/><ellipse cx="-95" cy="20" fill="none" stroke="#d6dee0" stroke-width="4" rx="20" ry="32"/></g></g><g transform="translate(680 540)"><rect width="780" height="80" x="0" y="0" fill="#12151a" stroke="rgba(255,255,255,0.10)" stroke-width="2" rx="40"/><rect width="780" height="80" x="0" y="0" fill="#d6dee0" class="level" rx="40"/><text x="0" y="-20" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" letter-spacing="2">0</text><text x="195" y="-20" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" letter-spacing="2">25</text><text x="390" y="-20" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" letter-spacing="2">50</text><text x="585" y="-20" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" letter-spacing="2">75</text><text x="780" y="-20" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" letter-spacing="2">100</text><text x="780" y="160" fill="#f4f6f8" class="num" font-family="&quot;Bricolage Grotesque&quot;,&quot;Geist&quot;,-apple-system,sans-serif" font-size="120" font-weight="700" letter-spacing="-.04em" text-anchor="end">82</text><text x="780" y="200" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="16" letter-spacing="3" text-anchor="end">dB</text></g></g></svg>