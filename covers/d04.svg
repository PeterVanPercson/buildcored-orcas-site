<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" class="orcas-v3-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1600 1200"><style>@import url(&apos;/fonts.css&apos;);

    .orcas-v3-svg { display: block; width: 100%; height: 100%; }
    .orcas-v3-svg * { transform-box: fill-box; }

    /* ── motion primitives ──────────────────────────────────────── */
    @keyframes k-fade        { 0%,15%   { opacity: 0 } 30%,75% { opacity: 1 } 90%,100% { opacity: 0 } }
    @keyframes k-fade-in     { 0%       { opacity: 0 } 35%,100% { opacity: 1 } }
    @keyframes k-fade-loop   { 0%,30%   { opacity: 0 } 50%,80% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes k-blink       { 0%,90%,100% { opacity: 1 } 95% { opacity: 0 } }
    @keyframes k-cursor      { 0%,49%   { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes k-pulse       { 0%,100%  { opacity: .25 } 50% { opacity: 1 } }
    @keyframes k-pulse-soft  { 0%,100%  { opacity: .5  } 50% { opacity: 1 } }
    @keyframes k-glow        { 0%,100%  { opacity: .15 } 50% { opacity: .9 } }
    @keyframes k-trace       { 0% { stroke-dashoffset: var(--len,1000) } 60%,100% { stroke-dashoffset: 0 } }
    @keyframes k-trace-loop  { 0%   { stroke-dashoffset: var(--len,1000); opacity: 1 }
                               55%  { stroke-dashoffset: 0; opacity: 1 }
                               92%  { opacity: 1 }
                               100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes k-amp         { 0%,100% { transform: scaleY(.25) } 50% { transform: scaleY(1.2) } }
    @keyframes k-tap         { 0%,100% { transform: scale(1) }    50% { transform: scale(1.18) } }
    @keyframes k-shutter     { 0%,88%,100% { opacity: 0 } 92%,96% { opacity: 1 } }
    @keyframes k-stagger-up  { 0%,15% { opacity: 0; transform: translateY(16px) }
                               30%,75% { opacity: 1; transform: translateY(0) }
                               92%,100% { opacity: 0; transform: translateY(-12px) } }
    @keyframes k-stagger-r   { 0%,15% { opacity: 0; transform: translateX(-12px) }
                               30%,80% { opacity: 1; transform: translateX(0) }
                               95%,100% { opacity: 0; transform: translateX(8px) } }
    @keyframes k-tilt        { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(22deg) } 100% { transform: rotate(0) } }
    @keyframes k-tilt-r      { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(-18deg) } 100% { transform: rotate(0) } }
    @keyframes k-sweep-x     { 0% { transform: translateX(0) } 100% { transform: translateX(var(--dx,40px)) } }
    @keyframes k-sweep-y     { 0% { transform: translateY(0) } 100% { transform: translateY(var(--dy,40px)) } }
    @keyframes k-bob         { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    @keyframes k-breath      { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
    @keyframes k-spin        { from { transform: rotate(0) } to { transform: rotate(360deg) } }
    @keyframes k-ripple      { 0% { opacity: 1; transform: scale(.3) } 100% { opacity: 0; transform: scale(2.3) } }
    @keyframes k-zoom-out    { 0% { opacity: 1; transform: scale(.2) } 100% { opacity: 0; transform: scale(1.6) } }
    @keyframes k-march       { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -40 } }
    @keyframes k-flow        { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -200 } }
    @keyframes k-shake       { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-3px) } 75% { transform: translateX(3px) } }
    @keyframes k-walkbar     { 0%,100% { transform: scaleX(0) } 50%,80% { transform: scaleX(1) } }
    @keyframes k-fill-l-to-r { 0% { transform: scaleX(0) } 100% { transform: scaleX(1) } }.s04 .lid   { animation: s04-lid 3s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
        .s04 .count { animation: s04-count 3s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
        .s04 .c1 { animation-delay: 0.0s; }
        .s04 .c2 { animation-delay: 0.5s; }
        .s04 .c3 { animation-delay: 1.0s; }
        .s04 .lock-body  { animation: k-fade-loop 3s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 1.5s; }
        .s04 .lock-shackle { animation: s04-shackle 3s cubic-bezier(0.16, 1, 0.3, 1) infinite; transform-origin: 100% 100%; }
        @keyframes s04-lid    { 0%,8%,17%,25%,34%,100% { transform: scaleY(1)    } 13%,21%,30% { transform: scaleY(0.05) } }
        @keyframes s04-count  { 0%,15% { opacity: 0; transform: scale(0.6) } 30%,70% { opacity: 1; transform: scale(1) } 100% { opacity: 1 } }
        @keyframes s04-shackle{ 0%,40% { transform: translateY(-60px) } 60%,100% { transform: translateY(0) } }</style><defs><radialGradient id="of3-vign" cx="50%" cy="55%" r="75%"><stop offset="55%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.45)"/></radialGradient><radialGradient id="of3-top" cx="50%" cy="0%" r="60%"><stop offset="0%" stop-color="rgba(214,222,224,0.05)"/><stop offset="100%" stop-color="rgba(214,222,224,0)"/></radialGradient><pattern id="of3-hatch" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" x2="0" y1="0" y2="16" stroke="rgba(255,255,255,0.024)" stroke-width="1"/></pattern></defs><rect width="1600" height="1200" fill="#181c22"/><rect width="1600" height="1200" fill="url(#of3-hatch)"/><rect width="1600" height="1200" fill="url(#of3-top)"/><rect width="1600" height="1200" fill="url(#of3-vign)"/><rect width="1598" height="1198" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/><g class="s04"><g transform="translate(80 120)"><circle cx="0" cy="0" r="6" fill="#d6dee0"/><text x="20" y="6" fill="#898f97" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3">EYE · blink rate</text></g><g transform="translate(920 120)"><circle cx="0" cy="0" r="6" fill="#d6dee0"/><text x="20" y="6" fill="#898f97" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3">ACTION</text></g><g transform="translate(440 600)"><path fill="#12151a" stroke="#898f97" stroke-width="4" d="M-240 0Q0-200 240 0 0 200-240 0Z"/><circle cx="0" cy="0" r="80" fill="none" stroke="#d6dee0" stroke-width="4"/><circle cx="0" cy="0" r="36" fill="#d6dee0"/><circle cx="22" cy="-22" r="14" fill="#12151a"/><g class="lid" style="transform-origin:0px 0px"><path fill="#181c22" d="M-240 0Q0-200 240 0z"/></g></g><g transform="translate(180 1020)"><text x="0" y="-30" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="16" letter-spacing="3">BLINKS</text><circle cx="20" cy="0" r="18" fill="#d6dee0" class="count c1"/><circle cx="80" cy="0" r="18" fill="#d6dee0" class="count c2"/><circle cx="140" cy="0" r="18" fill="#d6dee0" class="count c3"/><text x="260" y="8" fill="#d6dee0" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="22" letter-spacing="2">3 / 3</text></g><g transform="translate(1200 600)"><g class="lock-shackle"><path fill="none" stroke="#d6dee0" stroke-linecap="round" stroke-width="16" d="M-80 20v-80a80 80 0 0 1 160 0v80"/></g><g class="lock-body"><rect width="240" height="200" x="-120" y="20" fill="#12151a" stroke="#d6dee0" stroke-width="4" rx="22"/><circle cx="0" cy="100" r="20" fill="#d6dee0"/><rect width="16" height="60" x="-8" y="110" fill="#d6dee0" rx="4"/></g></g></g></svg>