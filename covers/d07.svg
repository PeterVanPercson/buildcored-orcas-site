<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" class="orcas-v3-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1600 1200"><style>@import url(&apos;/fonts.css&apos;);

    .orcas-v3-svg { display: block; width: 100%; height: 100%; }
    .orcas-v3-svg * { transform-box: fill-box; }

    /* ── motion primitives ──────────────────────────────────────── */
    @keyframes k-fade        { 0%,15%   { opacity: 0 } 30%,75% { opacity: 1 } 90%,100% { opacity: 0 } }
    @keyframes k-fade-in     { 0%       { opacity: 0 } 35%,100% { opacity: 1 } }
    @keyframes k-fade-loop   { 0%,30%   { opacity: 0 } 50%,80% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes k-blink       { 0%,90%,100% { opacity: 1 } 95% { opacity: 0 } }
    @keyframes k-cursor      { 0%,49%   { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes k-pulse       { 0%,100%  { opacity: .25 } 50% { opacity: 1 } }
    @keyframes k-pulse-soft  { 0%,100%  { opacity: .5  } 50% { opacity: 1 } }
    @keyframes k-glow        { 0%,100%  { opacity: .15 } 50% { opacity: .9 } }
    @keyframes k-trace       { 0% { stroke-dashoffset: var(--len,1000) } 60%,100% { stroke-dashoffset: 0 } }
    @keyframes k-trace-loop  { 0%   { stroke-dashoffset: var(--len,1000); opacity: 1 }
                               55%  { stroke-dashoffset: 0; opacity: 1 }
                               92%  { opacity: 1 }
                               100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes k-amp         { 0%,100% { transform: scaleY(.25) } 50% { transform: scaleY(1.2) } }
    @keyframes k-tap         { 0%,100% { transform: scale(1) }    50% { transform: scale(1.18) } }
    @keyframes k-shutter     { 0%,88%,100% { opacity: 0 } 92%,96% { opacity: 1 } }
    @keyframes k-stagger-up  { 0%,15% { opacity: 0; transform: translateY(16px) }
                               30%,75% { opacity: 1; transform: translateY(0) }
                               92%,100% { opacity: 0; transform: translateY(-12px) } }
    @keyframes k-stagger-r   { 0%,15% { opacity: 0; transform: translateX(-12px) }
                               30%,80% { opacity: 1; transform: translateX(0) }
                               95%,100% { opacity: 0; transform: translateX(8px) } }
    @keyframes k-tilt        { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(22deg) } 100% { transform: rotate(0) } }
    @keyframes k-tilt-r      { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(-18deg) } 100% { transform: rotate(0) } }
    @keyframes k-sweep-x     { 0% { transform: translateX(0) } 100% { transform: translateX(var(--dx,40px)) } }
    @keyframes k-sweep-y     { 0% { transform: translateY(0) } 100% { transform: translateY(var(--dy,40px)) } }
    @keyframes k-bob         { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    @keyframes k-breath      { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
    @keyframes k-spin        { from { transform: rotate(0) } to { transform: rotate(360deg) } }
    @keyframes k-ripple      { 0% { opacity: 1; transform: scale(.3) } 100% { opacity: 0; transform: scale(2.3) } }
    @keyframes k-zoom-out    { 0% { opacity: 1; transform: scale(.2) } 100% { opacity: 0; transform: scale(1.6) } }
    @keyframes k-march       { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -40 } }
    @keyframes k-flow        { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -200 } }
    @keyframes k-shake       { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-3px) } 75% { transform: translateX(3px) } }
    @keyframes k-walkbar     { 0%,100% { transform: scaleX(0) } 50%,80% { transform: scaleX(1) } }
    @keyframes k-fill-l-to-r { 0% { transform: scaleX(0) } 100% { transform: scaleX(1) } }.s07 .key { animation: s07-key 2.5s cubic-bezier(0.16, 1, 0.3, 1) infinite; transform-origin: 50% 0%; }
        .s07 .k1 { animation-delay: 0.0s; }
        .s07 .k2 { animation-delay: 0.4s; }
        .s07 .k3 { animation-delay: 0.8s; }
        .s07 .k4 { animation-delay: 1.2s; }
        .s07 .wave { animation: s07-wave 2.5s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
        @keyframes s07-key { 0%, 100% { transform: translateY(0); fill: #12151a } 10%, 30% { transform: translateY(8px); fill: #d6dee0 } }
        @keyframes s07-wave { 0%, 15% { opacity: 0.2 } 30%, 80% { opacity: 1 } 95%, 100% { opacity: 0.2 } }</style><defs><radialGradient id="of3-vign" cx="50%" cy="55%" r="75%"><stop offset="55%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.45)"/></radialGradient><radialGradient id="of3-top" cx="50%" cy="0%" r="60%"><stop offset="0%" stop-color="rgba(214,222,224,0.05)"/><stop offset="100%" stop-color="rgba(214,222,224,0)"/></radialGradient><pattern id="of3-hatch" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" x2="0" y1="0" y2="16" stroke="rgba(255,255,255,0.024)" stroke-width="1"/></pattern></defs><rect width="1600" height="1200" fill="#181c22"/><rect width="1600" height="1200" fill="url(#of3-hatch)"/><rect width="1600" height="1200" fill="url(#of3-top)"/><rect width="1600" height="1200" fill="url(#of3-vign)"/><rect width="1598" height="1198" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/><g class="s07"><g transform="translate(80 120)"><circle cx="0" cy="0" r="6" fill="#d6dee0"/><text x="20" y="6" fill="#898f97" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3">KEYS</text></g><g transform="translate(780 120)"><circle cx="0" cy="0" r="6" fill="#d6dee0"/><text x="20" y="6" fill="#898f97" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3">WAVEFORM · sum</text></g><g stroke="#d6dee0" stroke-width="3" transform="translate(120 300)"><g class="key k1"><rect width="560" height="120" x="0" y="0" fill="#12151a" rx="14"/><text x="40" y="76" fill="#c4cad1" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="44" font-weight="500">Q</text><text x="520" y="76" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="22" letter-spacing="3" text-anchor="end">261 Hz</text></g><g class="key k2"><rect width="560" height="120" x="0" y="150" fill="#12151a" rx="14"/><text x="40" y="226" fill="#c4cad1" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="44" font-weight="500">W</text><text x="520" y="226" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="22" letter-spacing="3" text-anchor="end">329 Hz</text></g><g class="key k3"><rect width="560" height="120" x="0" y="300" fill="#12151a" rx="14"/><text x="40" y="376" fill="#c4cad1" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="44" font-weight="500">E</text><text x="520" y="376" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="22" letter-spacing="3" text-anchor="end">392 Hz</text></g><g class="key k4"><rect width="560" height="120" x="0" y="450" fill="#12151a" rx="14"/><text x="40" y="526" fill="#c4cad1" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="44" font-weight="500">R</text><text x="520" y="526" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="22" letter-spacing="3" text-anchor="end">523 Hz</text></g></g><g transform="translate(780 540)"><line x1="0" x2="720" y1="0" y2="0" stroke="#363a40" stroke-dasharray="4 8" stroke-width="1.5"/><path fill="none" stroke="#3d4e63" stroke-width="3" d="M0 0q60-40 120 0t120 0 120 0 120 0 120 0 120 0" class="wave" opacity=".6"/><path fill="none" stroke="#3d4e63" stroke-width="3" d="M0 0q36-60 72 0t72 0 72 0 72 0 72 0 72 0 72 0 72 0 72 0 72 0" class="wave" opacity=".4" style="animation-delay:0.4s"/><path fill="none" stroke="#d6dee0" stroke-linecap="round" stroke-linejoin="round" stroke-width="6" d="M0 0c60-120 120-80 180-40 40 30 80-140 140-20S420 140 480 60c60-100 100-180 160-80 40 80 80 20 80 20" class="wave"/></g></g></svg>