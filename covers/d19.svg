<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" class="orcas-v3-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1600 1200"><style>@import url(&apos;/fonts.css&apos;);

    .orcas-v3-svg { display: block; width: 100%; height: 100%; }
    .orcas-v3-svg * { transform-box: fill-box; }

    /* ── motion primitives ──────────────────────────────────────── */
    @keyframes k-fade        { 0%,15%   { opacity: 0 } 30%,75% { opacity: 1 } 90%,100% { opacity: 0 } }
    @keyframes k-fade-in     { 0%       { opacity: 0 } 35%,100% { opacity: 1 } }
    @keyframes k-fade-loop   { 0%,30%   { opacity: 0 } 50%,80% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes k-blink       { 0%,90%,100% { opacity: 1 } 95% { opacity: 0 } }
    @keyframes k-cursor      { 0%,49%   { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes k-pulse       { 0%,100%  { opacity: .25 } 50% { opacity: 1 } }
    @keyframes k-pulse-soft  { 0%,100%  { opacity: .5  } 50% { opacity: 1 } }
    @keyframes k-glow        { 0%,100%  { opacity: .15 } 50% { opacity: .9 } }
    @keyframes k-trace       { 0% { stroke-dashoffset: var(--len,1000) } 60%,100% { stroke-dashoffset: 0 } }
    @keyframes k-trace-loop  { 0%   { stroke-dashoffset: var(--len,1000); opacity: 1 }
                               55%  { stroke-dashoffset: 0; opacity: 1 }
                               92%  { opacity: 1 }
                               100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes k-amp         { 0%,100% { transform: scaleY(.25) } 50% { transform: scaleY(1.2) } }
    @keyframes k-tap         { 0%,100% { transform: scale(1) }    50% { transform: scale(1.18) } }
    @keyframes k-shutter     { 0%,88%,100% { opacity: 0 } 92%,96% { opacity: 1 } }
    @keyframes k-stagger-up  { 0%,15% { opacity: 0; transform: translateY(16px) }
                               30%,75% { opacity: 1; transform: translateY(0) }
                               92%,100% { opacity: 0; transform: translateY(-12px) } }
    @keyframes k-stagger-r   { 0%,15% { opacity: 0; transform: translateX(-12px) }
                               30%,80% { opacity: 1; transform: translateX(0) }
                               95%,100% { opacity: 0; transform: translateX(8px) } }
    @keyframes k-tilt        { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(22deg) } 100% { transform: rotate(0) } }
    @keyframes k-tilt-r      { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(-18deg) } 100% { transform: rotate(0) } }
    @keyframes k-sweep-x     { 0% { transform: translateX(0) } 100% { transform: translateX(var(--dx,40px)) } }
    @keyframes k-sweep-y     { 0% { transform: translateY(0) } 100% { transform: translateY(var(--dy,40px)) } }
    @keyframes k-bob         { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    @keyframes k-breath      { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
    @keyframes k-spin        { from { transform: rotate(0) } to { transform: rotate(360deg) } }
    @keyframes k-ripple      { 0% { opacity: 1; transform: scale(.3) } 100% { opacity: 0; transform: scale(2.3) } }
    @keyframes k-zoom-out    { 0% { opacity: 1; transform: scale(.2) } 100% { opacity: 0; transform: scale(1.6) } }
    @keyframes k-march       { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -40 } }
    @keyframes k-flow        { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -200 } }
    @keyframes k-shake       { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-3px) } 75% { transform: translateX(3px) } }
    @keyframes k-walkbar     { 0%,100% { transform: scaleX(0) } 50%,80% { transform: scaleX(1) } }
    @keyframes k-fill-l-to-r { 0% { transform: scaleX(0) } 100% { transform: scaleX(1) } }.s19 .packet { animation: s19-packet 3s linear infinite; }
        .s19 .p2 { animation-delay: 1s; }
        @keyframes s19-packet { 0% { transform: translateX(0); opacity: 0 } 10%, 80% { opacity: 1 } 100% { transform: translateX(620px); opacity: 0 } }
        .s19 .sda-pulse { animation: k-pulse 3s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
        .s19 .scl { stroke-dasharray: 6 6; animation: k-march 1s linear infinite; }</style><defs><radialGradient id="of3-vign" cx="50%" cy="55%" r="75%"><stop offset="55%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.45)"/></radialGradient><radialGradient id="of3-top" cx="50%" cy="0%" r="60%"><stop offset="0%" stop-color="rgba(214,222,224,0.05)"/><stop offset="100%" stop-color="rgba(214,222,224,0)"/></radialGradient><pattern id="of3-hatch" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" x2="0" y1="0" y2="16" stroke="rgba(255,255,255,0.024)" stroke-width="1"/></pattern></defs><rect width="1600" height="1200" fill="#181c22"/><rect width="1600" height="1200" fill="url(#of3-hatch)"/><rect width="1600" height="1200" fill="url(#of3-top)"/><rect width="1600" height="1200" fill="url(#of3-vign)"/><rect width="1598" height="1198" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/><g class="s19"><g transform="translate(80 120)"><circle cx="0" cy="0" r="6" fill="#d6dee0"/><text x="20" y="6" fill="#898f97" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3">I²C BUS</text></g><g transform="translate(120 320)"><rect width="300" height="240" x="0" y="0" fill="#12151a" stroke="#d6dee0" stroke-width="3" rx="14"/><g><rect width="20" height="12" x="-20" y="34" fill="#d6dee0"/><rect width="20" height="12" x="300" y="34" fill="#d6dee0"/></g><g><rect width="20" height="12" x="-20" y="74" fill="#d6dee0"/><rect width="20" height="12" x="300" y="74" fill="#d6dee0"/></g><g><rect width="20" height="12" x="-20" y="114" fill="#d6dee0"/><rect width="20" height="12" x="300" y="114" fill="#d6dee0"/></g><g><rect width="20" height="12" x="-20" y="154" fill="#d6dee0"/><rect width="20" height="12" x="300" y="154" fill="#d6dee0"/></g><g><rect width="20" height="12" x="-20" y="194" fill="#d6dee0"/><rect width="20" height="12" x="300" y="194" fill="#d6dee0"/></g><g><rect width="20" height="12" x="-20" y="234" fill="#d6dee0"/><rect width="20" height="12" x="300" y="234" fill="#d6dee0"/></g><text x="150" y="130" fill="#d6dee0" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="24" letter-spacing="2" text-anchor="middle">MASTER</text><text x="150" y="160" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" letter-spacing="2" text-anchor="middle">MCU</text></g><g transform="translate(1180 320)"><rect width="300" height="240" x="0" y="0" fill="#12151a" stroke="#3d4e63" stroke-width="3" rx="14"/><g><rect width="20" height="12" x="-20" y="34" fill="#3d4e63"/><rect width="20" height="12" x="300" y="34" fill="#3d4e63"/></g><g><rect width="20" height="12" x="-20" y="74" fill="#3d4e63"/><rect width="20" height="12" x="300" y="74" fill="#3d4e63"/></g><g><rect width="20" height="12" x="-20" y="114" fill="#3d4e63"/><rect width="20" height="12" x="300" y="114" fill="#3d4e63"/></g><g><rect width="20" height="12" x="-20" y="154" fill="#3d4e63"/><rect width="20" height="12" x="300" y="154" fill="#3d4e63"/></g><g><rect width="20" height="12" x="-20" y="194" fill="#3d4e63"/><rect width="20" height="12" x="300" y="194" fill="#3d4e63"/></g><g><rect width="20" height="12" x="-20" y="234" fill="#3d4e63"/><rect width="20" height="12" x="300" y="234" fill="#3d4e63"/></g><text x="150" y="130" fill="#c4cad1" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="24" letter-spacing="2" text-anchor="middle">SLAVE</text><text x="150" y="160" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" letter-spacing="2" text-anchor="middle">0x68</text></g><g transform="translate(420 360)"><text x="0" y="-20" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" letter-spacing="3">SDA</text><line x1="0" x2="760" y1="0" y2="0" stroke="#d6dee0" stroke-width="4"/><g class="packet"><rect width="80" height="36" x="0" y="-18" fill="#d6dee0" rx="6"/><text x="40" y="6" fill="#0b0d10" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" font-weight="600" text-anchor="middle">0xA5</text></g><text x="0" y="100" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" letter-spacing="3">SCL</text><line x1="0" x2="760" y1="120" y2="120" stroke="#3d4e63" stroke-width="4" class="scl"/><g class="packet p2" transform="translate(0 120)"><rect width="80" height="36" x="0" y="-18" fill="#3d4e63" rx="6"/><text x="40" y="6" fill="#f4f6f8" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" font-weight="600" text-anchor="middle">CLK</text></g></g><g font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="22" transform="translate(120 740)"><text x="0" y="0" fill="#585d64" letter-spacing="3">LOG</text><text x="0" y="50" fill="#d6dee0">&gt;</text><text x="40" y="50" fill="#c4cad1">START · 0x68 · WRITE</text><text x="0" y="100" fill="#d6dee0">&gt;</text><text x="40" y="100" fill="#c4cad1">0xA5 · ACK</text><text x="0" y="150" fill="#d6dee0">&gt;</text><text x="40" y="150" fill="#c4cad1">STOP</text></g></g></svg>