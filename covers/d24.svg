<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" width="1600" height="1200" class="orcas-v3-svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;family=Geist:wght@400;500&amp;display=swap');
.bg{fill:#0b0d10}
.lbl{font-family:"Geist Mono",ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:5px;text-transform:uppercase;fill:#898f97}
.dot{fill:#6ee2a1}
.sheet{fill:#e9eaec;stroke:#c4c8cd;stroke-width:1.5}
.sline{stroke:#b7bcc2;stroke-width:7;stroke-linecap:round}
.scap{font-family:"Geist Mono",monospace;font-size:16px;letter-spacing:1px;fill:#585d64}
.panel{fill:#12151a;stroke:#2a2f37;stroke-width:1.5}
.q{font-family:"Geist",system-ui,sans-serif;font-weight:500;font-size:38px;fill:#f4f6f8}
.a{font-family:"Geist",system-ui,sans-serif;font-weight:400;font-size:34px;fill:#c4cad1}
.cite{font-family:"Geist Mono",monospace;font-size:20px;letter-spacing:1px;fill:#6ee2a1}
.tag{font-family:"Geist Mono",monospace;font-size:18px;letter-spacing:2px;fill:#585d64;text-transform:uppercase}
.pulse{animation:k-pulse 2.4s ease-in-out infinite}@keyframes k-pulse{0%,100%{opacity:.35}50%{opacity:1}}
.qin{opacity:0;animation:k-in 7s ease-out infinite}
.ain{opacity:0;animation:k-in 7s ease-out 1.3s infinite}
.cin{opacity:0;animation:k-in 7s ease-out 2.1s infinite}
@keyframes k-in{0%,7%{opacity:0}16%,88%{opacity:1}97%,100%{opacity:0}}
.scan{animation:k-scan 3s ease-in-out infinite}@keyframes k-scan{0%,100%{opacity:.25}50%{opacity:.7}}
</style>
<rect class="bg" width="1600" height="1200"/>
<circle class="dot pulse" cx="70" cy="74" r="7"/>
<text class="lbl" x="98" y="82">Datasheets · STM32F4</text>
<text class="lbl" x="1530" y="82" text-anchor="end">Assistant</text>
<circle class="dot pulse" cx="1556" cy="74" r="7"/>

<!-- datasheet page (left) -->
<g transform="translate(150 250)">
  <rect class="sheet" x="0" y="0" width="500" height="700" rx="10"/>
  <text class="scap" x="40" y="60" fill="#585d64">RM0090 · §6.3.16</text>
  <g class="scline"><line class="sline" x1="40" y1="120" x2="460" y2="120"/><line class="sline" x1="40" y1="158" x2="430" y2="158"/><line class="sline" x1="40" y1="196" x2="460" y2="196"/><line class="sline" x1="40" y1="234" x2="380" y2="234"/></g>
  <rect class="scan" x="40" y="280" width="420" height="44" rx="4" fill="#6ee2a1"/>
  <g><line class="sline" x1="40" y1="372" x2="460" y2="372"/><line class="sline" x1="40" y1="410" x2="440" y2="410"/><line class="sline" x1="40" y1="448" x2="460" y2="448"/><line class="sline" x1="40" y1="486" x2="400" y2="486"/><line class="sline" x1="40" y1="524" x2="450" y2="524"/></g>
  <rect x="40" y="580" width="420" height="80" rx="6" fill="none" stroke="#b7bcc2" stroke-width="1.5"/>
  <text class="scap" x="60" y="628">Fig 12 · GPIO source/sink limits</text>
</g>

<!-- assistant panel (right) — generous fixed spacing, zero overlap -->
<g transform="translate(760 250)">
  <rect class="panel" x="0" y="0" width="690" height="700" rx="18"/>
  <circle class="dot pulse" cx="44" cy="56" r="6"/>
  <text class="tag" x="66" y="62" fill="#6ee2a1">Hardware TA</text>

  <!-- question: 2 lines, baselines 150 & 200 -->
  <g class="qin">
    <text class="q" x="44" y="150">What's the max GPIO</text>
    <text class="q" x="44" y="200">source current?</text>
  </g>

  <!-- answer: starts at y=300 — 100px clear of the question -->
  <g class="ain">
    <text class="a" x="44" y="304">25 mA per pin.</text>
    <text class="a" x="44" y="350">Sum across a port can't</text>
    <text class="a" x="44" y="396">exceed 120 mA.</text>
  </g>

  <!-- citation chip -->
  <g class="cin" transform="translate(44 470)">
    <rect x="0" y="0" width="420" height="58" rx="10" fill="#171b21" stroke="#2f5f47" stroke-width="1.5"/>
    <text class="cite" x="22" y="38">RM0090 · §6.3.16 · pg 144</text>
  </g>
  <text class="tag" x="44" y="640">Sourced from 3 datasheets</text>
</g>
</svg>
