<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" class="orcas-v3-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1600 1200"><style>@import url(&apos;/fonts.css&apos;);

    .orcas-v3-svg { display: block; width: 100%; height: 100%; }
    .orcas-v3-svg * { transform-box: fill-box; }

    /* ── motion primitives ──────────────────────────────────────── */
    @keyframes k-fade        { 0%,15%   { opacity: 0 } 30%,75% { opacity: 1 } 90%,100% { opacity: 0 } }
    @keyframes k-fade-in     { 0%       { opacity: 0 } 35%,100% { opacity: 1 } }
    @keyframes k-fade-loop   { 0%,30%   { opacity: 0 } 50%,80% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes k-blink       { 0%,90%,100% { opacity: 1 } 95% { opacity: 0 } }
    @keyframes k-cursor      { 0%,49%   { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes k-pulse       { 0%,100%  { opacity: .25 } 50% { opacity: 1 } }
    @keyframes k-pulse-soft  { 0%,100%  { opacity: .5  } 50% { opacity: 1 } }
    @keyframes k-glow        { 0%,100%  { opacity: .15 } 50% { opacity: .9 } }
    @keyframes k-trace       { 0% { stroke-dashoffset: var(--len,1000) } 60%,100% { stroke-dashoffset: 0 } }
    @keyframes k-trace-loop  { 0%   { stroke-dashoffset: var(--len,1000); opacity: 1 }
                               55%  { stroke-dashoffset: 0; opacity: 1 }
                               92%  { opacity: 1 }
                               100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes k-amp         { 0%,100% { transform: scaleY(.25) } 50% { transform: scaleY(1.2) } }
    @keyframes k-tap         { 0%,100% { transform: scale(1) }    50% { transform: scale(1.18) } }
    @keyframes k-shutter     { 0%,88%,100% { opacity: 0 } 92%,96% { opacity: 1 } }
    @keyframes k-stagger-up  { 0%,15% { opacity: 0; transform: translateY(16px) }
                               30%,75% { opacity: 1; transform: translateY(0) }
                               92%,100% { opacity: 0; transform: translateY(-12px) } }
    @keyframes k-stagger-r   { 0%,15% { opacity: 0; transform: translateX(-12px) }
                               30%,80% { opacity: 1; transform: translateX(0) }
                               95%,100% { opacity: 0; transform: translateX(8px) } }
    @keyframes k-tilt        { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(22deg) } 100% { transform: rotate(0) } }
    @keyframes k-tilt-r      { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(-18deg) } 100% { transform: rotate(0) } }
    @keyframes k-sweep-x     { 0% { transform: translateX(0) } 100% { transform: translateX(var(--dx,40px)) } }
    @keyframes k-sweep-y     { 0% { transform: translateY(0) } 100% { transform: translateY(var(--dy,40px)) } }
    @keyframes k-bob         { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    @keyframes k-breath      { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
    @keyframes k-spin        { from { transform: rotate(0) } to { transform: rotate(360deg) } }
    @keyframes k-ripple      { 0% { opacity: 1; transform: scale(.3) } 100% { opacity: 0; transform: scale(2.3) } }
    @keyframes k-zoom-out    { 0% { opacity: 1; transform: scale(.2) } 100% { opacity: 0; transform: scale(1.6) } }
    @keyframes k-march       { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -40 } }
    @keyframes k-flow        { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -200 } }
    @keyframes k-shake       { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-3px) } 75% { transform: translateX(3px) } }
    @keyframes k-walkbar     { 0%,100% { transform: scaleX(0) } 50%,80% { transform: scaleX(1) } }
    @keyframes k-fill-l-to-r { 0% { transform: scaleX(0) } 100% { transform: scaleX(1) } }.s01 .indicator   { animation: s01-tilt 4s cubic-bezier(0.16, 1, 0.3, 1) infinite; transform-origin: 800px 480px; }
        .s01 .needle      { animation: s01-tilt 4s cubic-bezier(0.16, 1, 0.3, 1) infinite; transform-origin: 0 0; }
        .s01 .state-pause { animation: s01-fade-pause 4s linear infinite; }
        .s01 .state-play  { animation: s01-fade-play  4s linear infinite; }
        .s01 .bar         { animation: s01-bar 0.9s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate; transform-origin: 50% 100%; }
        @keyframes s01-tilt        { 0%,30%,90%,100% { transform: rotate(-6deg) } 50%,75% { transform: rotate(28deg) } }
        @keyframes s01-fade-play   { 0%,30%,85%,100% { opacity: 0 } 50%,75% { opacity: 1 } }
        @keyframes s01-fade-pause  { 0%,30%,85%,100% { opacity: 1 } 50%,75% { opacity: 0 } }
        @keyframes s01-bar         { 0% { transform: scaleY(0.25) } 100% { transform: scaleY(1) } }</style><defs><radialGradient id="of3-vign" cx="50%" cy="55%" r="75%"><stop offset="55%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.45)"/></radialGradient><radialGradient id="of3-top" cx="50%" cy="0%" r="60%"><stop offset="0%" stop-color="rgba(214,222,224,0.05)"/><stop offset="100%" stop-color="rgba(214,222,224,0)"/></radialGradient><pattern id="of3-hatch" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" x2="0" y1="0" y2="16" stroke="rgba(255,255,255,0.024)" stroke-width="1"/></pattern></defs><rect width="1600" height="1200" fill="#181c22"/><rect width="1600" height="1200" fill="url(#of3-hatch)"/><rect width="1600" height="1200" fill="url(#of3-top)"/><rect width="1600" height="1200" fill="url(#of3-vign)"/><rect width="1598" height="1198" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/><g class="s01"><g transform="translate(80 120)"><circle cx="0" cy="0" r="6" fill="#d6dee0"/><text x="20" y="6" fill="#898f97" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3">POSE · pitch</text></g><g transform="translate(880 120)"><circle cx="0" cy="0" r="6" fill="#d6dee0"/><text x="20" y="6" fill="#898f97" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3">OUTPUT · audio</text></g><g class="indicator-wrap" transform="translate(800 480)"><circle cx="0" cy="0" r="220" fill="none" stroke="#363a40" stroke-width="2"/><circle cx="0" cy="0" r="220" fill="none" stroke="rgba(255,255,255,0.10)" stroke-dasharray="2 12" stroke-width="1"/><line x1="0" x2="0" y1="-220" y2="-205" stroke="#585d64" stroke-width="3" transform="rotate(-60)"/><line x1="0" x2="0" y1="-220" y2="-205" stroke="#585d64" stroke-width="3" transform="rotate(-30)"/><line x1="0" x2="0" y1="-220" y2="-205" stroke="#585d64" stroke-width="3"/><line x1="0" x2="0" y1="-220" y2="-205" stroke="#585d64" stroke-width="3" transform="rotate(30)"/><line x1="0" x2="0" y1="-220" y2="-205" stroke="#585d64" stroke-width="3" transform="rotate(60)"/><text x="0" y="-250" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="16" letter-spacing="2" text-anchor="middle">UP</text><text x="0" y="270" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="16" letter-spacing="2" text-anchor="middle">DOWN</text><g class="needle"><line x1="0" x2="0" y1="0" y2="-180" stroke="#d6dee0" stroke-linecap="round" stroke-width="6"/><circle cx="0" cy="0" r="14" fill="#d6dee0"/><circle cx="0" cy="-180" r="8" fill="#d6dee0"/></g></g><g class="state-pause" transform="translate(140 360)"><rect width="280" height="56" x="0" y="0" fill="none" stroke="#585d64" stroke-width="2" rx="28"/><rect width="8" height="24" x="22" y="16" fill="#898f97"/><rect width="8" height="24" x="38" y="16" fill="#898f97"/><text x="60" y="36" fill="#898f97" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="18" letter-spacing="3">PAUSED</text></g><g class="state-play" transform="translate(140 360)"><rect width="280" height="56" x="0" y="0" fill="rgba(214,222,224,0.08)" stroke="#d6dee0" stroke-width="2" rx="28"/><path fill="#d6dee0" d="M22 16v24l26-12Z"/><text x="60" y="36" fill="#d6dee0" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="18" letter-spacing="3">PLAYING</text></g><g transform="translate(1100 760)"><rect width="18" height="180" x="0" y="-180" fill="#d6dee0" class="bar" rx="6" style="animation-delay:0s;transform-origin:9px 0px"/><rect width="18" height="180" x="32" y="-180" fill="#d6dee0" class="bar" rx="6" style="animation-delay:0.06s;transform-origin:41px 0px"/><rect width="18" height="180" x="64" y="-180" fill="#d6dee0" class="bar" rx="6" style="animation-delay:0.12s;transform-origin:73px 0px"/><rect width="18" height="180" x="96" y="-180" fill="#d6dee0" class="bar" rx="6" style="animation-delay:0.18s;transform-origin:105px 0px"/><rect width="18" height="180" x="128" y="-180" fill="#d6dee0" class="bar" rx="6" style="animation-delay:0.24s;transform-origin:137px 0px"/><rect width="18" height="180" x="160" y="-180" fill="#d6dee0" class="bar" rx="6" style="animation-delay:0.3s;transform-origin:169px 0px"/><rect width="18" height="180" x="192" y="-180" fill="#d6dee0" class="bar" rx="6" style="animation-delay:0.36s;transform-origin:201px 0px"/><rect width="18" height="180" x="224" y="-180" fill="#d6dee0" class="bar" rx="6" style="animation-delay:0.42s;transform-origin:233px 0px"/><rect width="18" height="180" x="256" y="-180" fill="#d6dee0" class="bar" rx="6" style="animation-delay:0.48s;transform-origin:265px 0px"/><rect width="18" height="180" x="288" y="-180" fill="#d6dee0" class="bar" rx="6" style="animation-delay:0.54s;transform-origin:297px 0px"/><rect width="18" height="180" x="320" y="-180" fill="#d6dee0" class="bar" rx="6" style="animation-delay:0.6s;transform-origin:329px 0px"/><rect width="18" height="180" x="352" y="-180" fill="#d6dee0" class="bar" rx="6" style="animation-delay:0.66s;transform-origin:361px 0px"/><rect width="18" height="180" x="384" y="-180" fill="#d6dee0" class="bar" rx="6" style="animation-delay:0.72s;transform-origin:393px 0px"/><rect width="18" height="180" x="416" y="-180" fill="#d6dee0" class="bar" rx="6" style="animation-delay:0.78s;transform-origin:425px 0px"/></g></g></svg>