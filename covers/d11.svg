<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" class="orcas-v3-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1600 1200"><style>@import url(&apos;/fonts.css&apos;);

    .orcas-v3-svg { display: block; width: 100%; height: 100%; }
    .orcas-v3-svg * { transform-box: fill-box; }

    /* ── motion primitives ──────────────────────────────────────── */
    @keyframes k-fade        { 0%,15%   { opacity: 0 } 30%,75% { opacity: 1 } 90%,100% { opacity: 0 } }
    @keyframes k-fade-in     { 0%       { opacity: 0 } 35%,100% { opacity: 1 } }
    @keyframes k-fade-loop   { 0%,30%   { opacity: 0 } 50%,80% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes k-blink       { 0%,90%,100% { opacity: 1 } 95% { opacity: 0 } }
    @keyframes k-cursor      { 0%,49%   { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes k-pulse       { 0%,100%  { opacity: .25 } 50% { opacity: 1 } }
    @keyframes k-pulse-soft  { 0%,100%  { opacity: .5  } 50% { opacity: 1 } }
    @keyframes k-glow        { 0%,100%  { opacity: .15 } 50% { opacity: .9 } }
    @keyframes k-trace       { 0% { stroke-dashoffset: var(--len,1000) } 60%,100% { stroke-dashoffset: 0 } }
    @keyframes k-trace-loop  { 0%   { stroke-dashoffset: var(--len,1000); opacity: 1 }
                               55%  { stroke-dashoffset: 0; opacity: 1 }
                               92%  { opacity: 1 }
                               100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes k-amp         { 0%,100% { transform: scaleY(.25) } 50% { transform: scaleY(1.2) } }
    @keyframes k-tap         { 0%,100% { transform: scale(1) }    50% { transform: scale(1.18) } }
    @keyframes k-shutter     { 0%,88%,100% { opacity: 0 } 92%,96% { opacity: 1 } }
    @keyframes k-stagger-up  { 0%,15% { opacity: 0; transform: translateY(16px) }
                               30%,75% { opacity: 1; transform: translateY(0) }
                               92%,100% { opacity: 0; transform: translateY(-12px) } }
    @keyframes k-stagger-r   { 0%,15% { opacity: 0; transform: translateX(-12px) }
                               30%,80% { opacity: 1; transform: translateX(0) }
                               95%,100% { opacity: 0; transform: translateX(8px) } }
    @keyframes k-tilt        { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(22deg) } 100% { transform: rotate(0) } }
    @keyframes k-tilt-r      { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(-18deg) } 100% { transform: rotate(0) } }
    @keyframes k-sweep-x     { 0% { transform: translateX(0) } 100% { transform: translateX(var(--dx,40px)) } }
    @keyframes k-sweep-y     { 0% { transform: translateY(0) } 100% { transform: translateY(var(--dy,40px)) } }
    @keyframes k-bob         { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    @keyframes k-breath      { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
    @keyframes k-spin        { from { transform: rotate(0) } to { transform: rotate(360deg) } }
    @keyframes k-ripple      { 0% { opacity: 1; transform: scale(.3) } 100% { opacity: 0; transform: scale(2.3) } }
    @keyframes k-zoom-out    { 0% { opacity: 1; transform: scale(.2) } 100% { opacity: 0; transform: scale(1.6) } }
    @keyframes k-march       { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -40 } }
    @keyframes k-flow        { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -200 } }
    @keyframes k-shake       { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-3px) } 75% { transform: translateX(3px) } }
    @keyframes k-walkbar     { 0%,100% { transform: scaleX(0) } 50%,80% { transform: scaleX(1) } }
    @keyframes k-fill-l-to-r { 0% { transform: scaleX(0) } 100% { transform: scaleX(1) } }.s11 .word-1 { animation: s11-w 6s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 0s; opacity: 0; }
        .s11 .word-2 { animation: s11-w 6s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 2s; opacity: 0; }
        .s11 .word-3 { animation: s11-w 6s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 4s; opacity: 0; }
        @keyframes s11-w { 0% { opacity: 0; transform: translateY(20px) } 8%,28% { opacity: 1; transform: translateY(0) } 34%,100% { opacity: 0; transform: translateY(-12px) } }
        .s11 .wave-a { animation: s11-wa 6s cubic-bezier(0.16, 1, 0.3, 1) infinite; opacity: 0; }
        .s11 .wave-b { animation: s11-wa 6s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 2s; opacity: 0; }
        .s11 .wave-c { animation: s11-wa 6s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 4s; opacity: 0; }
        @keyframes s11-wa { 0% { opacity: 0 } 12%,28% { opacity: 1 } 32%,100% { opacity: 0 } }</style><defs><radialGradient id="of3-vign" cx="50%" cy="55%" r="75%"><stop offset="55%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.45)"/></radialGradient><radialGradient id="of3-top" cx="50%" cy="0%" r="60%"><stop offset="0%" stop-color="rgba(214,222,224,0.05)"/><stop offset="100%" stop-color="rgba(214,222,224,0)"/></radialGradient><pattern id="of3-hatch" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" x2="0" y1="0" y2="16" stroke="rgba(255,255,255,0.024)" stroke-width="1"/></pattern></defs><rect width="1600" height="1200" fill="#181c22"/><rect width="1600" height="1200" fill="url(#of3-hatch)"/><rect width="1600" height="1200" fill="url(#of3-top)"/><rect width="1600" height="1200" fill="url(#of3-vign)"/><rect width="1598" height="1198" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/><g class="s11"><g transform="translate(80 120)"><circle cx="0" cy="0" r="6" fill="#d6dee0"/><text x="20" y="6" fill="#898f97" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3">MOOD · prompt</text></g><g transform="translate(80 660)"><circle cx="0" cy="0" r="6" fill="#d6dee0"/><text x="20" y="6" fill="#898f97" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3">AMBIENT · output</text></g><g transform="translate(80 200)"><rect width="1440" height="180" x="0" y="0" fill="#12151a" stroke="rgba(255,255,255,0.10)" stroke-width="2" rx="20"/><text x="40" y="50" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="16" letter-spacing="3">prompt</text><text x="40" y="130" fill="#d6dee0" class="word-1" font-family="&quot;Bricolage Grotesque&quot;,&quot;Geist&quot;,-apple-system,sans-serif" font-size="80" font-weight="600" letter-spacing="-.02em">calm</text><text x="40" y="130" fill="#d6dee0" class="word-2" font-family="&quot;Bricolage Grotesque&quot;,&quot;Geist&quot;,-apple-system,sans-serif" font-size="80" font-weight="600" letter-spacing="-.02em">stormy</text><text x="40" y="130" fill="#d6dee0" class="word-3" font-family="&quot;Bricolage Grotesque&quot;,&quot;Geist&quot;,-apple-system,sans-serif" font-size="80" font-weight="600" letter-spacing="-.02em">nocturnal</text></g><g transform="translate(80 740)"><rect width="1440" height="320" x="0" y="0" fill="#12151a" stroke="rgba(255,255,255,0.10)" stroke-width="2" rx="20"/><line x1="40" x2="1400" y1="160" y2="160" stroke="#363a40" stroke-dasharray="4 8" stroke-width="2"/><path fill="none" stroke="#d6dee0" stroke-linecap="round" stroke-width="5" d="M40 160c200-80 400 80 600 0s400 80 600 0h160" class="wave-a"/><path fill="none" stroke="#d6dee0" stroke-width="3" d="M40 160 80 60l40 180 40-150 40 140 40-160 40 150 40-140 40 170 40-190 40 180 40-160 40 150 40-140 40 160 40-180 40 170 40-180 40 160 40-120 40 130 40-150 40 160 40-170 40 160 40-140 40 150 40-160 40 140 40-120 40 130 40-150 40 160 40-140 40 60" class="wave-b"/><path fill="none" stroke="#d6dee0" stroke-linecap="round" stroke-width="4" d="M40 160c200-80 200-60 400 0q100 10 120-15t80 15c200-60 200 60 400 0q100 10 120-15t80 15h160" class="wave-c"/></g></g></svg>