<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" class="orcas-v3-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1600 1200"><style>@import url(&apos;/fonts.css&apos;);
.bg{fill:#0b0d10}
.lbl{font-family:&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:5px;text-transform:uppercase;fill:#898f97}
.dot{fill:#6ee2a1}
.tile{fill:#12151a;stroke:#2a2f37;stroke-width:1.5;rx:14}
.tname{font-family:&quot;Geist Mono&quot;,monospace;font-size:19px;letter-spacing:2px;text-transform:uppercase;fill:#c4cad1}
.tsub{font-family:&quot;Geist Mono&quot;,monospace;font-size:14px;letter-spacing:1px;fill:#585d64}
.spark{stroke:#6ee2a1;stroke-width:2.5;fill:none;opacity:.85}
.wire{stroke:#363a40;stroke-width:1.5;fill:none}
.os{font-family:&quot;Bricolage Grotesque&quot;,sans-serif;font-weight:700;fill:#f4f6f8}
.ver{font-family:&quot;Geist Mono&quot;,monospace;font-size:22px;letter-spacing:4px;fill:#6ee2a1}
.serif{font-family:&quot;Cormorant Garamond&quot;,Georgia,serif;font-style:italic;fill:#898f97;font-size:34px}
.pulse{animation:k-pulse 2.6s ease-in-out infinite}@keyframes k-pulse{0%,100%{opacity:.35}50%{opacity:1}}
.boot{animation:k-boot 6s ease-in-out infinite}@keyframes k-boot{0%{opacity:0;transform:translateY(14px)}10%,82%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(-8px)}}
.t1{animation:k-rise 6s ease-out infinite}.t2{animation:k-rise 6s ease-out .15s infinite}.t3{animation:k-rise 6s ease-out .3s infinite}.t4{animation:k-rise 6s ease-out .45s infinite}.t5{animation:k-rise 6s ease-out .6s infinite}.t6{animation:k-rise 6s ease-out .75s infinite}
@keyframes k-rise{0%,8%{opacity:0;transform:translateY(22px)}22%,82%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(-10px)}}
.scan{animation:k-scan 3.4s linear infinite}@keyframes k-scan{0%{transform:scaleX(0)}60%,100%{transform:scaleX(1)}}</style><rect width="1600" height="1200" class="bg"/><circle cx="70" cy="74" r="7" class="dot pulse"/><text x="98" y="82" class="lbl">Capstone · ORCA OS</text><text x="1530" y="82" class="lbl" text-anchor="end">v1.0 · shipped</text><circle cx="1556" cy="74" r="7" class="dot pulse"/><g class="boot"><text x="100" y="248" class="os" font-size="92" letter-spacing="-3">ORCA OS</text><text x="104" y="300" class="ver">BOOT COMPLETE · 30/30 MODULES</text><text x="104" y="360" class="serif">the best of thirty days, one system.</text></g><g transform="translate(100 440)"><g class="t1"><rect width="440" height="200" x="0" y="0" class="tile" rx="14"/><text x="28" y="48" class="tname">SCOPE</text><text x="28" y="78" class="tsub">spectrum · 20Hz–20kHz</text><polyline points="28,170 70,150 110,120 150,90 190,130 230,70 270,150 310,110 350,160 400,140" class="spark"/></g><g class="t2"><rect width="440" height="200" x="480" y="0" class="tile" rx="14"/><text x="508" y="48" class="tname">CACHE</text><text x="508" y="78" class="tsub">4-way · 32B lines</text><g fill="#6ee2a1"><rect width="60" height="22" x="508" y="110" rx="3"/><rect width="60" height="22" x="580" y="110" opacity=".5" rx="3"/><rect width="60" height="22" x="652" y="110" rx="3"/><rect width="60" height="22" x="724" y="110" opacity=".5" rx="3"/></g><text x="508" y="170" fill="#6ee2a1" class="tsub">HIT 0x0024 → 7A 3C E1</text></g><g class="t3"><rect width="440" height="200" x="960" y="0" class="tile" rx="14"/><text x="988" y="48" class="tname">WHISPER</text><text x="988" y="78" class="tsub">offline · whisper.cpp</text><g stroke="#d6dee0" stroke-linecap="round" stroke-width="6"><line x1="988" x2="988" y1="150" y2="150"/><line x1="1018" x2="1018" y1="138" y2="162"/><line x1="1048" x2="1048" y1="118" y2="182"/><line x1="1078" x2="1078" y1="132" y2="168"/><line x1="1108" x2="1108" y1="108" y2="192"/><line x1="1138" x2="1138" y1="140" y2="160"/><line x1="1168" x2="1168" y1="124" y2="176"/><line x1="1198" x2="1198" y1="146" y2="154"/></g></g><g class="t4"><rect width="440" height="200" x="0" y="232" class="tile" rx="14"/><text x="28" y="280" class="tname">DEPTH</text><text x="28" y="310" class="tsub">near → far map</text><g transform="translate(28 332)"><rect width="384" height="78" fill="url(#dg)" rx="6"/></g></g><g class="t5"><rect width="440" height="200" x="480" y="232" class="tile" rx="14"/><text x="508" y="280" class="tname">MORSE</text><text x="508" y="310" class="tsub">spacebar → text</text><g fill="#d6dee0"><rect width="18" height="22" x="508" y="340" rx="2"/><rect width="52" height="22" x="538" y="340" rx="2"/><rect width="18" height="22" x="602" y="340" rx="2"/><rect width="52" height="22" x="632" y="340" rx="2"/></g><text x="508" y="400" fill="#6ee2a1" class="tsub">DECODED · &quot;OS&quot;</text></g><g class="t6"><rect width="440" height="200" x="960" y="232" class="tile" rx="14"/><text x="988" y="280" class="tname">SEMAPHORE</text><text x="988" y="310" class="tsub">hands → letters</text><g fill="none" stroke="#f4f6f8" stroke-linecap="round" stroke-width="8" transform="translate(1110 392)"><circle cx="0" cy="-44" r="16"/><path d="M0-28v66m0 0-28 40M0 38l28 40"/><path stroke="#6ee2a1" d="m0-6-46-34"/><path stroke="#d6dee0" d="m0-6 46-34"/></g></g></g><g transform="translate(100 700)"><rect width="1400" height="6" x="0" y="0" fill="#1c2026" rx="3"/><rect width="1400" height="6" x="0" y="0" fill="#6ee2a1" class="scan" rx="3" style="transform-origin:0 0"/></g><defs><linearGradient id="dg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#f4f6f8"/><stop offset="1" stop-color="#1c2026"/></linearGradient></defs></svg>