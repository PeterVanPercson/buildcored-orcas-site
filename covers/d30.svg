<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" width="1600" height="1200" class="orcas-v3-svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;family=Bricolage+Grotesque:wght@600;700&amp;family=Cormorant+Garamond:ital@1&amp;display=swap');
.bg{fill:#0b0d10}
.lbl{font-family:"Geist Mono",ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:5px;text-transform:uppercase;fill:#898f97}
.dot{fill:#6ee2a1}
.tile{fill:#12151a;stroke:#2a2f37;stroke-width:1.5;rx:14}
.tname{font-family:"Geist Mono",monospace;font-size:19px;letter-spacing:2px;text-transform:uppercase;fill:#c4cad1}
.tsub{font-family:"Geist Mono",monospace;font-size:14px;letter-spacing:1px;fill:#585d64}
.spark{stroke:#6ee2a1;stroke-width:2.5;fill:none;opacity:.85}
.wire{stroke:#363a40;stroke-width:1.5;fill:none}
.os{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;fill:#f4f6f8}
.ver{font-family:"Geist Mono",monospace;font-size:22px;letter-spacing:4px;fill:#6ee2a1}
.serif{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;fill:#898f97;font-size:34px}
.pulse{animation:k-pulse 2.6s ease-in-out infinite}@keyframes k-pulse{0%,100%{opacity:.35}50%{opacity:1}}
.boot{animation:k-boot 6s ease-in-out infinite}@keyframes k-boot{0%{opacity:0;transform:translateY(14px)}10%,82%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(-8px)}}
.t1{animation:k-rise 6s ease-out infinite}.t2{animation:k-rise 6s ease-out .15s infinite}.t3{animation:k-rise 6s ease-out .3s infinite}.t4{animation:k-rise 6s ease-out .45s infinite}.t5{animation:k-rise 6s ease-out .6s infinite}.t6{animation:k-rise 6s ease-out .75s infinite}
@keyframes k-rise{0%,8%{opacity:0;transform:translateY(22px)}22%,82%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(-10px)}}
.scan{animation:k-scan 3.4s linear infinite}@keyframes k-scan{0%{transform:scaleX(0)}60%,100%{transform:scaleX(1)}}
</style>
<rect class="bg" width="1600" height="1200"/>
<circle class="dot pulse" cx="70" cy="74" r="7"/>
<text class="lbl" x="98" y="82">Capstone · ORCA OS</text>
<text class="lbl" x="1530" y="82" text-anchor="end">v1.0 · shipped</text>
<circle class="dot pulse" cx="1556" cy="74" r="7"/>

<!-- title block -->
<g class="boot">
  <text class="os" x="100" y="248" font-size="92" letter-spacing="-3">ORCA OS</text>
  <text class="ver" x="104" y="300">BOOT COMPLETE · 30/30 MODULES</text>
  <text class="serif" x="104" y="360">the best of thirty days, one system.</text>
</g>

<!-- module grid: 6 best modules booting in -->
<g transform="translate(100 440)">
  <!-- row 1 -->
  <g class="t1"><rect class="tile" x="0" y="0" width="440" height="200" rx="14"/>
    <text class="tname" x="28" y="48">SCOPE</text><text class="tsub" x="28" y="78">spectrum · 20Hz–20kHz</text>
    <polyline class="spark" points="28,170 70,150 110,120 150,90 190,130 230,70 270,150 310,110 350,160 400,140"/></g>
  <g class="t2"><rect class="tile" x="480" y="0" width="440" height="200" rx="14"/>
    <text class="tname" x="508" y="48">CACHE</text><text class="tsub" x="508" y="78">4-way · 32B lines</text>
    <g fill="#6ee2a1"><rect x="508" y="110" width="60" height="22" rx="3"/><rect x="580" y="110" width="60" height="22" rx="3" opacity=".5"/><rect x="652" y="110" width="60" height="22" rx="3"/><rect x="724" y="110" width="60" height="22" rx="3" opacity=".5"/></g>
    <text class="tsub" x="508" y="170" fill="#6ee2a1">HIT 0x0024 → 7A 3C E1</text></g>
  <g class="t3"><rect class="tile" x="960" y="0" width="440" height="200" rx="14"/>
    <text class="tname" x="988" y="48">WHISPER</text><text class="tsub" x="988" y="78">offline · whisper.cpp</text>
    <g stroke="#d6dee0" stroke-width="6" stroke-linecap="round"><line x1="988" y1="150" x2="988" y2="150"/><line x1="1018" y1="138" x2="1018" y2="162"/><line x1="1048" y1="118" x2="1048" y2="182"/><line x1="1078" y1="132" x2="1078" y2="168"/><line x1="1108" y1="108" x2="1108" y2="192"/><line x1="1138" y1="140" x2="1138" y2="160"/><line x1="1168" y1="124" x2="1168" y2="176"/><line x1="1198" y1="146" x2="1198" y2="154"/></g></g>
  <!-- row 2 -->
  <g class="t4"><rect class="tile" x="0" y="232" width="440" height="200" rx="14"/>
    <text class="tname" x="28" y="280">DEPTH</text><text class="tsub" x="28" y="310">near → far map</text>
    <g transform="translate(28 332)"><rect width="384" height="78" rx="6" fill="url(#dg)"/></g></g>
  <g class="t5"><rect class="tile" x="480" y="232" width="440" height="200" rx="14"/>
    <text class="tname" x="508" y="280">MORSE</text><text class="tsub" x="508" y="310">spacebar → text</text>
    <g fill="#d6dee0"><rect x="508" y="340" width="18" height="22" rx="2"/><rect x="538" y="340" width="52" height="22" rx="2"/><rect x="602" y="340" width="18" height="22" rx="2"/><rect x="632" y="340" width="52" height="22" rx="2"/></g>
    <text class="tsub" x="508" y="400" fill="#6ee2a1">DECODED · "OS"</text></g>
  <g class="t6"><rect class="tile" x="960" y="232" width="440" height="200" rx="14"/>
    <text class="tname" x="988" y="280">SEMAPHORE</text><text class="tsub" x="988" y="310">hands → letters</text>
    <g transform="translate(1110 392)" stroke="#f4f6f8" stroke-width="8" stroke-linecap="round" fill="none"><circle cx="0" cy="-44" r="16"/><path d="M0 -28 L0 38 M0 38 L-28 78 M0 38 L28 78"/><path d="M0 -6 L-46 -40" stroke="#6ee2a1"/><path d="M0 -6 L46 -40" stroke="#d6dee0"/></g></g>
</g>

<!-- boot progress bar -->
<g transform="translate(100 700)">
  <rect x="0" y="0" width="1400" height="6" rx="3" fill="#1c2026"/>
  <rect x="0" y="0" width="1400" height="6" rx="3" fill="#6ee2a1" class="scan" style="transform-origin:0 0"/>
</g>

<defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4f6f8"/><stop offset="1" stop-color="#1c2026"/></linearGradient></defs>
</svg>
