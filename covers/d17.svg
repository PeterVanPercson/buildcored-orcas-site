<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" class="orcas-v3-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1600 1200"><style>@import url(&apos;/fonts.css&apos;);

    .orcas-v3-svg { display: block; width: 100%; height: 100%; }
    .orcas-v3-svg * { transform-box: fill-box; }

    /* ── motion primitives ──────────────────────────────────────── */
    @keyframes k-fade        { 0%,15%   { opacity: 0 } 30%,75% { opacity: 1 } 90%,100% { opacity: 0 } }
    @keyframes k-fade-in     { 0%       { opacity: 0 } 35%,100% { opacity: 1 } }
    @keyframes k-fade-loop   { 0%,30%   { opacity: 0 } 50%,80% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes k-blink       { 0%,90%,100% { opacity: 1 } 95% { opacity: 0 } }
    @keyframes k-cursor      { 0%,49%   { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes k-pulse       { 0%,100%  { opacity: .25 } 50% { opacity: 1 } }
    @keyframes k-pulse-soft  { 0%,100%  { opacity: .5  } 50% { opacity: 1 } }
    @keyframes k-glow        { 0%,100%  { opacity: .15 } 50% { opacity: .9 } }
    @keyframes k-trace       { 0% { stroke-dashoffset: var(--len,1000) } 60%,100% { stroke-dashoffset: 0 } }
    @keyframes k-trace-loop  { 0%   { stroke-dashoffset: var(--len,1000); opacity: 1 }
                               55%  { stroke-dashoffset: 0; opacity: 1 }
                               92%  { opacity: 1 }
                               100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes k-amp         { 0%,100% { transform: scaleY(.25) } 50% { transform: scaleY(1.2) } }
    @keyframes k-tap         { 0%,100% { transform: scale(1) }    50% { transform: scale(1.18) } }
    @keyframes k-shutter     { 0%,88%,100% { opacity: 0 } 92%,96% { opacity: 1 } }
    @keyframes k-stagger-up  { 0%,15% { opacity: 0; transform: translateY(16px) }
                               30%,75% { opacity: 1; transform: translateY(0) }
                               92%,100% { opacity: 0; transform: translateY(-12px) } }
    @keyframes k-stagger-r   { 0%,15% { opacity: 0; transform: translateX(-12px) }
                               30%,80% { opacity: 1; transform: translateX(0) }
                               95%,100% { opacity: 0; transform: translateX(8px) } }
    @keyframes k-tilt        { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(22deg) } 100% { transform: rotate(0) } }
    @keyframes k-tilt-r      { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(-18deg) } 100% { transform: rotate(0) } }
    @keyframes k-sweep-x     { 0% { transform: translateX(0) } 100% { transform: translateX(var(--dx,40px)) } }
    @keyframes k-sweep-y     { 0% { transform: translateY(0) } 100% { transform: translateY(var(--dy,40px)) } }
    @keyframes k-bob         { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    @keyframes k-breath      { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
    @keyframes k-spin        { from { transform: rotate(0) } to { transform: rotate(360deg) } }
    @keyframes k-ripple      { 0% { opacity: 1; transform: scale(.3) } 100% { opacity: 0; transform: scale(2.3) } }
    @keyframes k-zoom-out    { 0% { opacity: 1; transform: scale(.2) } 100% { opacity: 0; transform: scale(1.6) } }
    @keyframes k-march       { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -40 } }
    @keyframes k-flow        { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -200 } }
    @keyframes k-shake       { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-3px) } 75% { transform: translateX(3px) } }
    @keyframes k-walkbar     { 0%,100% { transform: scaleX(0) } 50%,80% { transform: scaleX(1) } }
    @keyframes k-fill-l-to-r { 0% { transform: scaleX(0) } 100% { transform: scaleX(1) } }.s17 .knob   { animation: s17-knob 4s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate; }
        .s17 .duty1  { animation: s17-d1 4s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate; }
        .s17 .duty2  { animation: s17-d2 4s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate; }
        .s17 .led    { animation: s17-led 4s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate; }
        @keyframes s17-knob { 0% { transform: translateX(0) } 100% { transform: translateX(420px) } }
        @keyframes s17-d1   { 0% { transform: scaleX(0.2); transform-origin: 0 0 } 100% { transform: scaleX(0.9); transform-origin: 0 0 } }
        @keyframes s17-d2   { 0% { opacity: 0.15 } 100% { opacity: 0.95 } }
        @keyframes s17-led  { 0% { opacity: 0.15 } 100% { opacity: 1 } }</style><defs><radialGradient id="of3-vign" cx="50%" cy="55%" r="75%"><stop offset="55%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.45)"/></radialGradient><radialGradient id="of3-top" cx="50%" cy="0%" r="60%"><stop offset="0%" stop-color="rgba(214,222,224,0.05)"/><stop offset="100%" stop-color="rgba(214,222,224,0)"/></radialGradient><pattern id="of3-hatch" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" x2="0" y1="0" y2="16" stroke="rgba(255,255,255,0.024)" stroke-width="1"/></pattern></defs><rect width="1600" height="1200" fill="#181c22"/><rect width="1600" height="1200" fill="url(#of3-hatch)"/><rect width="1600" height="1200" fill="url(#of3-top)"/><rect width="1600" height="1200" fill="url(#of3-vign)"/><rect width="1598" height="1198" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/><g class="s17"><g transform="translate(80 120)"><circle cx="0" cy="0" r="6" fill="#d6dee0"/><text x="20" y="6" fill="#898f97" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3">DUTY CYCLE</text></g><g transform="translate(80 420)"><circle cx="0" cy="0" r="6" fill="#d6dee0"/><text x="20" y="6" fill="#898f97" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3">SQUARE WAVE · 1 kHz</text></g><g transform="translate(1080 120)"><circle cx="0" cy="0" r="6" fill="#d6dee0"/><text x="20" y="6" fill="#898f97" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3">LED</text></g><g transform="translate(80 220)"><rect width="520" height="24" x="0" y="-12" fill="#12151a" stroke="rgba(255,255,255,0.10)" rx="12"/><g class="knob"><circle cx="40" cy="0" r="24" fill="#d6dee0"/></g><text x="0" y="60" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" letter-spacing="3">0%</text><text x="520" y="60" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" letter-spacing="3" text-anchor="end">100%</text></g><g transform="translate(80 540)"><line x1="0" x2="1440" y1="100" y2="100" stroke="#363a40" stroke-dasharray="4 8" stroke-width="1.5"/><g fill="none" stroke="#d6dee0" stroke-linecap="square" stroke-width="6"><g><path d="M0 100V0h100v100h80" class="duty1" style="transform-origin:0px 100px"/><path d="M0 100h180" class="duty2" style="opacity:0.2"/></g><g transform="translate(180)"><path d="M0 100V0h100v100h80" class="duty1" style="transform-origin:0px 100px"/><path d="M0 100h180" class="duty2" style="opacity:0.2"/></g><g transform="translate(360)"><path d="M0 100V0h100v100h80" class="duty1" style="transform-origin:0px 100px"/><path d="M0 100h180" class="duty2" style="opacity:0.2"/></g><g transform="translate(540)"><path d="M0 100V0h100v100h80" class="duty1" style="transform-origin:0px 100px"/><path d="M0 100h180" class="duty2" style="opacity:0.2"/></g><g transform="translate(720)"><path d="M0 100V0h100v100h80" class="duty1" style="transform-origin:0px 100px"/><path d="M0 100h180" class="duty2" style="opacity:0.2"/></g><g transform="translate(900)"><path d="M0 100V0h100v100h80" class="duty1" style="transform-origin:0px 100px"/><path d="M0 100h180" class="duty2" style="opacity:0.2"/></g><g transform="translate(1080)"><path d="M0 100V0h100v100h80" class="duty1" style="transform-origin:0px 100px"/><path d="M0 100h180" class="duty2" style="opacity:0.2"/></g><g transform="translate(1260)"><path d="M0 100V0h100v100h80" class="duty1" style="transform-origin:0px 100px"/><path d="M0 100h180" class="duty2" style="opacity:0.2"/></g></g></g><g transform="translate(1240 260)"><circle cx="0" cy="0" r="120" fill="#12151a" stroke="rgba(255,255,255,0.18)" stroke-width="3"/><circle cx="0" cy="0" r="100" fill="#d6dee0" class="led"/><circle cx="-30" cy="-30" r="20" fill="rgba(255,255,255,0.4)"/><line x1="-30" x2="-30" y1="120" y2="200" stroke="#898f97" stroke-linecap="round" stroke-width="6"/><line x1="30" x2="30" y1="120" y2="200" stroke="#898f97" stroke-linecap="round" stroke-width="6"/></g></g></svg>