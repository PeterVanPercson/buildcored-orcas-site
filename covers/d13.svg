<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" class="orcas-v3-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1600 1200"><style>@import url(&apos;/fonts.css&apos;);

    .orcas-v3-svg { display: block; width: 100%; height: 100%; }
    .orcas-v3-svg * { transform-box: fill-box; }

    /* ── motion primitives ──────────────────────────────────────── */
    @keyframes k-fade        { 0%,15%   { opacity: 0 } 30%,75% { opacity: 1 } 90%,100% { opacity: 0 } }
    @keyframes k-fade-in     { 0%       { opacity: 0 } 35%,100% { opacity: 1 } }
    @keyframes k-fade-loop   { 0%,30%   { opacity: 0 } 50%,80% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes k-blink       { 0%,90%,100% { opacity: 1 } 95% { opacity: 0 } }
    @keyframes k-cursor      { 0%,49%   { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes k-pulse       { 0%,100%  { opacity: .25 } 50% { opacity: 1 } }
    @keyframes k-pulse-soft  { 0%,100%  { opacity: .5  } 50% { opacity: 1 } }
    @keyframes k-glow        { 0%,100%  { opacity: .15 } 50% { opacity: .9 } }
    @keyframes k-trace       { 0% { stroke-dashoffset: var(--len,1000) } 60%,100% { stroke-dashoffset: 0 } }
    @keyframes k-trace-loop  { 0%   { stroke-dashoffset: var(--len,1000); opacity: 1 }
                               55%  { stroke-dashoffset: 0; opacity: 1 }
                               92%  { opacity: 1 }
                               100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes k-amp         { 0%,100% { transform: scaleY(.25) } 50% { transform: scaleY(1.2) } }
    @keyframes k-tap         { 0%,100% { transform: scale(1) }    50% { transform: scale(1.18) } }
    @keyframes k-shutter     { 0%,88%,100% { opacity: 0 } 92%,96% { opacity: 1 } }
    @keyframes k-stagger-up  { 0%,15% { opacity: 0; transform: translateY(16px) }
                               30%,75% { opacity: 1; transform: translateY(0) }
                               92%,100% { opacity: 0; transform: translateY(-12px) } }
    @keyframes k-stagger-r   { 0%,15% { opacity: 0; transform: translateX(-12px) }
                               30%,80% { opacity: 1; transform: translateX(0) }
                               95%,100% { opacity: 0; transform: translateX(8px) } }
    @keyframes k-tilt        { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(22deg) } 100% { transform: rotate(0) } }
    @keyframes k-tilt-r      { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(-18deg) } 100% { transform: rotate(0) } }
    @keyframes k-sweep-x     { 0% { transform: translateX(0) } 100% { transform: translateX(var(--dx,40px)) } }
    @keyframes k-sweep-y     { 0% { transform: translateY(0) } 100% { transform: translateY(var(--dy,40px)) } }
    @keyframes k-bob         { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    @keyframes k-breath      { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
    @keyframes k-spin        { from { transform: rotate(0) } to { transform: rotate(360deg) } }
    @keyframes k-ripple      { 0% { opacity: 1; transform: scale(.3) } 100% { opacity: 0; transform: scale(2.3) } }
    @keyframes k-zoom-out    { 0% { opacity: 1; transform: scale(.2) } 100% { opacity: 0; transform: scale(1.6) } }
    @keyframes k-march       { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -40 } }
    @keyframes k-flow        { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -200 } }
    @keyframes k-shake       { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-3px) } 75% { transform: translateX(3px) } }
    @keyframes k-walkbar     { 0%,100% { transform: scaleX(0) } 50%,80% { transform: scaleX(1) } }
    @keyframes k-fill-l-to-r { 0% { transform: scaleX(0) } 100% { transform: scaleX(1) } }.s13 .commit { animation: k-stagger-r 6s cubic-bezier(0.16, 1, 0.3, 1) infinite; opacity: 0; }
        .s13 .c1 { animation-delay: 0.0s; }
        .s13 .c2 { animation-delay: 0.4s; }
        .s13 .c3 { animation-delay: 0.8s; }
        .s13 .c4 { animation-delay: 1.2s; }
        .s13 .c5 { animation-delay: 1.6s; }
        .s13 .summary { animation: k-stagger-up 6s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 2.4s; opacity: 0; }</style><defs><radialGradient id="of3-vign" cx="50%" cy="55%" r="75%"><stop offset="55%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.45)"/></radialGradient><radialGradient id="of3-top" cx="50%" cy="0%" r="60%"><stop offset="0%" stop-color="rgba(214,222,224,0.05)"/><stop offset="100%" stop-color="rgba(214,222,224,0)"/></radialGradient><pattern id="of3-hatch" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" x2="0" y1="0" y2="16" stroke="rgba(255,255,255,0.024)" stroke-width="1"/></pattern></defs><rect width="1600" height="1200" fill="#181c22"/><rect width="1600" height="1200" fill="url(#of3-hatch)"/><rect width="1600" height="1200" fill="url(#of3-top)"/><rect width="1600" height="1200" fill="url(#of3-vign)"/><rect width="1598" height="1198" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/><g class="s13"><g transform="translate(80 120)"><circle cx="0" cy="0" r="6" fill="#d6dee0"/><text x="20" y="6" fill="#898f97" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3">GIT LOG · today</text></g><g transform="translate(840 120)"><circle cx="0" cy="0" r="6" fill="#d6dee0"/><text x="20" y="6" fill="#898f97" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3">DEBRIEF · AI summary</text></g><g font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="22" transform="translate(80 200)"><g class="commit c1"><text x="0" y="34" fill="#f0b966">7a3f81d</text><text x="160" y="34" fill="#c4cad1">fix: stripe input edge case</text></g><g class="commit c2" transform="translate(0 72)"><text x="0" y="34" fill="#f0b966">9c44a2e</text><text x="160" y="34" fill="#c4cad1">refactor: move parser to its own module</text></g><g class="commit c3" transform="translate(0 144)"><text x="0" y="34" fill="#f0b966">1ef8b91</text><text x="160" y="34" fill="#c4cad1">feat: add CSV importer</text></g><g class="commit c4" transform="translate(0 216)"><text x="0" y="34" fill="#f0b966">0b2d4c7</text><text x="160" y="34" fill="#c4cad1">test: cover empty-row case</text></g><g class="commit c5" transform="translate(0 288)"><text x="0" y="34" fill="#f0b966">fa1909b</text><text x="160" y="34" fill="#c4cad1">docs: README for the importer</text></g></g><g class="summary" transform="translate(840 200)"><rect width="680" height="720" x="0" y="0" fill="#12151a" stroke="#d6dee0" stroke-width="2" rx="18"/><g transform="translate(36 60)"><text x="0" y="0" fill="#d6dee0" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" letter-spacing="3">SUMMARY · 14 MAY</text><text x="0" y="80" fill="#f4f6f8" font-family="&quot;Cormorant Garamond&quot;,Garamond,serif" font-size="34">You shipped a CSV importer.</text><text x="0" y="160" fill="#c4cad1" font-family="&quot;Geist&quot;,-apple-system,sans-serif" font-size="20">Five commits across three modules.</text><text x="0" y="200" fill="#c4cad1" font-family="&quot;Geist&quot;,-apple-system,sans-serif" font-size="20">Pulled parser into its own file —</text><text x="0" y="232" fill="#c4cad1" font-family="&quot;Geist&quot;,-apple-system,sans-serif" font-size="20">nice cleanup. Stripe edge case</text><text x="0" y="264" fill="#c4cad1" font-family="&quot;Geist&quot;,-apple-system,sans-serif" font-size="20">resolved.</text><text x="0" y="360" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="16" letter-spacing="2">3 files · +218 / −94 lines</text><text x="0" y="400" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="16" letter-spacing="2">longest streak: 47 min · 6 PM</text></g></g></g></svg>