<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" class="orcas-v3-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1600 1200"><style>@import url(&apos;/fonts.css&apos;);

    .orcas-v3-svg { display: block; width: 100%; height: 100%; }
    .orcas-v3-svg * { transform-box: fill-box; }

    /* ── motion primitives ──────────────────────────────────────── */
    @keyframes k-fade        { 0%,15%   { opacity: 0 } 30%,75% { opacity: 1 } 90%,100% { opacity: 0 } }
    @keyframes k-fade-in     { 0%       { opacity: 0 } 35%,100% { opacity: 1 } }
    @keyframes k-fade-loop   { 0%,30%   { opacity: 0 } 50%,80% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes k-blink       { 0%,90%,100% { opacity: 1 } 95% { opacity: 0 } }
    @keyframes k-cursor      { 0%,49%   { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes k-pulse       { 0%,100%  { opacity: .25 } 50% { opacity: 1 } }
    @keyframes k-pulse-soft  { 0%,100%  { opacity: .5  } 50% { opacity: 1 } }
    @keyframes k-glow        { 0%,100%  { opacity: .15 } 50% { opacity: .9 } }
    @keyframes k-trace       { 0% { stroke-dashoffset: var(--len,1000) } 60%,100% { stroke-dashoffset: 0 } }
    @keyframes k-trace-loop  { 0%   { stroke-dashoffset: var(--len,1000); opacity: 1 }
                               55%  { stroke-dashoffset: 0; opacity: 1 }
                               92%  { opacity: 1 }
                               100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes k-amp         { 0%,100% { transform: scaleY(.25) } 50% { transform: scaleY(1.2) } }
    @keyframes k-tap         { 0%,100% { transform: scale(1) }    50% { transform: scale(1.18) } }
    @keyframes k-shutter     { 0%,88%,100% { opacity: 0 } 92%,96% { opacity: 1 } }
    @keyframes k-stagger-up  { 0%,15% { opacity: 0; transform: translateY(16px) }
                               30%,75% { opacity: 1; transform: translateY(0) }
                               92%,100% { opacity: 0; transform: translateY(-12px) } }
    @keyframes k-stagger-r   { 0%,15% { opacity: 0; transform: translateX(-12px) }
                               30%,80% { opacity: 1; transform: translateX(0) }
                               95%,100% { opacity: 0; transform: translateX(8px) } }
    @keyframes k-tilt        { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(22deg) } 100% { transform: rotate(0) } }
    @keyframes k-tilt-r      { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(-18deg) } 100% { transform: rotate(0) } }
    @keyframes k-sweep-x     { 0% { transform: translateX(0) } 100% { transform: translateX(var(--dx,40px)) } }
    @keyframes k-sweep-y     { 0% { transform: translateY(0) } 100% { transform: translateY(var(--dy,40px)) } }
    @keyframes k-bob         { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    @keyframes k-breath      { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
    @keyframes k-spin        { from { transform: rotate(0) } to { transform: rotate(360deg) } }
    @keyframes k-ripple      { 0% { opacity: 1; transform: scale(.3) } 100% { opacity: 0; transform: scale(2.3) } }
    @keyframes k-zoom-out    { 0% { opacity: 1; transform: scale(.2) } 100% { opacity: 0; transform: scale(1.6) } }
    @keyframes k-march       { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -40 } }
    @keyframes k-flow        { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -200 } }
    @keyframes k-shake       { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-3px) } 75% { transform: translateX(3px) } }
    @keyframes k-walkbar     { 0%,100% { transform: scaleX(0) } 50%,80% { transform: scaleX(1) } }
    @keyframes k-fill-l-to-r { 0% { transform: scaleX(0) } 100% { transform: scaleX(1) } }.s21 .packet { animation: s21-pkt 2.5s linear infinite; }
        .s21 .p2 { animation-delay: 0.6s; }
        .s21 .p3 { animation-delay: 1.2s; }
        @keyframes s21-pkt { 0% { transform: translateX(0); opacity: 0 } 5%, 85% { opacity: 1 } 100% { transform: translateX(620px); opacity: 0 } }
        .s21 .trace { stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: k-trace-loop 3s linear infinite; --len: 2000; }</style><defs><radialGradient id="of3-vign" cx="50%" cy="55%" r="75%"><stop offset="55%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.45)"/></radialGradient><radialGradient id="of3-top" cx="50%" cy="0%" r="60%"><stop offset="0%" stop-color="rgba(214,222,224,0.05)"/><stop offset="100%" stop-color="rgba(214,222,224,0)"/></radialGradient><pattern id="of3-hatch" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" x2="0" y1="0" y2="16" stroke="rgba(255,255,255,0.024)" stroke-width="1"/></pattern></defs><rect width="1600" height="1200" fill="#181c22"/><rect width="1600" height="1200" fill="url(#of3-hatch)"/><rect width="1600" height="1200" fill="url(#of3-top)"/><rect width="1600" height="1200" fill="url(#of3-vign)"/><rect width="1598" height="1198" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/><g class="s21"><g transform="translate(80 120)"><circle cx="0" cy="0" r="6" fill="#d6dee0"/><text x="20" y="6" fill="#898f97" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3">NETWORK · UDP 9001</text></g><g transform="translate(120 280)"><rect width="260" height="180" x="0" y="0" fill="#12151a" stroke="rgba(255,255,255,0.18)" stroke-width="2" rx="14"/><rect width="180" height="120" x="40" y="20" fill="#181c22" stroke="rgba(255,255,255,0.10)" rx="6"/><text x="130" y="90" fill="#898f97" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="18" letter-spacing="2" text-anchor="middle">sensor.py</text><rect width="60" height="12" x="100" y="160" fill="#363a40" rx="4"/></g><g transform="translate(1220 280)"><rect width="260" height="180" x="0" y="0" fill="#12151a" stroke="rgba(255,255,255,0.18)" stroke-width="2" rx="14"/><rect width="180" height="120" x="40" y="20" fill="#181c22" stroke="#d6dee0" stroke-width="2" rx="6"/><text x="130" y="90" fill="#d6dee0" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="18" letter-spacing="2" text-anchor="middle">scope.py</text><rect width="60" height="12" x="100" y="160" fill="#363a40" rx="4"/></g><g transform="translate(420 370)"><line x1="0" x2="780" y1="0" y2="0" stroke="#363a40" stroke-dasharray="6 10" stroke-width="2"/><g class="packet"><rect width="100" height="44" x="0" y="-22" fill="#d6dee0" rx="8"/><text x="50" y="6" fill="#0b0d10" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" font-weight="600" text-anchor="middle">0x3F</text></g><g class="packet p2"><rect width="100" height="44" x="0" y="-22" fill="#d6dee0" rx="8"/><text x="50" y="6" fill="#0b0d10" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" font-weight="600" text-anchor="middle">0xA1</text></g><g class="packet p3"><rect width="100" height="44" x="0" y="-22" fill="#d6dee0" rx="8"/><text x="50" y="6" fill="#0b0d10" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" font-weight="600" text-anchor="middle">0x77</text></g></g><g transform="translate(80 580)"><rect width="1440" height="500" x="0" y="0" fill="#0b0d10" stroke="rgba(255,255,255,0.18)" stroke-width="2" rx="14"/><line x1="180" x2="180" y1="20" y2="480" stroke="#363a40" stroke-dasharray="2 6" stroke-width="1"/><line x1="360" x2="360" y1="20" y2="480" stroke="#363a40" stroke-dasharray="2 6" stroke-width="1"/><line x1="540" x2="540" y1="20" y2="480" stroke="#363a40" stroke-dasharray="2 6" stroke-width="1"/><line x1="720" x2="720" y1="20" y2="480" stroke="#363a40" stroke-dasharray="2 6" stroke-width="1"/><line x1="900" x2="900" y1="20" y2="480" stroke="#363a40" stroke-dasharray="2 6" stroke-width="1"/><line x1="1080" x2="1080" y1="20" y2="480" stroke="#363a40" stroke-dasharray="2 6" stroke-width="1"/><line x1="1260" x2="1260" y1="20" y2="480" stroke="#363a40" stroke-dasharray="2 6" stroke-width="1"/><line x1="20" x2="1420" y1="100" y2="100" stroke="#363a40" stroke-dasharray="2 6" stroke-width="1"/><line x1="20" x2="1420" y1="200" y2="200" stroke="#363a40" stroke-dasharray="2 6" stroke-width="1"/><line x1="20" x2="1420" y1="300" y2="300" stroke="#363a40" stroke-dasharray="2 6" stroke-width="1"/><line x1="20" x2="1420" y1="400" y2="400" stroke="#363a40" stroke-dasharray="2 6" stroke-width="1"/><line x1="20" x2="1420" y1="250" y2="250" stroke="#585d64" stroke-dasharray="3 8" stroke-width="1.5"/><path fill="none" stroke="#d6dee0" stroke-linecap="round" stroke-width="6" d="M20 250c80-120 160-120 220 0 60 130 140 130 200 0 60-150 140-150 200 0 60 130 140 130 200 0 60-100 140-100 200 0 60 130 140 130 200 0 60-120 140-120 180 0" class="trace"/></g></g></svg>