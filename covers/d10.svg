<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" class="orcas-v3-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1600 1200"><style>@import url(&apos;/fonts.css&apos;);

    .orcas-v3-svg { display: block; width: 100%; height: 100%; }
    .orcas-v3-svg * { transform-box: fill-box; }

    /* ── motion primitives ──────────────────────────────────────── */
    @keyframes k-fade        { 0%,15%   { opacity: 0 } 30%,75% { opacity: 1 } 90%,100% { opacity: 0 } }
    @keyframes k-fade-in     { 0%       { opacity: 0 } 35%,100% { opacity: 1 } }
    @keyframes k-fade-loop   { 0%,30%   { opacity: 0 } 50%,80% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes k-blink       { 0%,90%,100% { opacity: 1 } 95% { opacity: 0 } }
    @keyframes k-cursor      { 0%,49%   { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes k-pulse       { 0%,100%  { opacity: .25 } 50% { opacity: 1 } }
    @keyframes k-pulse-soft  { 0%,100%  { opacity: .5  } 50% { opacity: 1 } }
    @keyframes k-glow        { 0%,100%  { opacity: .15 } 50% { opacity: .9 } }
    @keyframes k-trace       { 0% { stroke-dashoffset: var(--len,1000) } 60%,100% { stroke-dashoffset: 0 } }
    @keyframes k-trace-loop  { 0%   { stroke-dashoffset: var(--len,1000); opacity: 1 }
                               55%  { stroke-dashoffset: 0; opacity: 1 }
                               92%  { opacity: 1 }
                               100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes k-amp         { 0%,100% { transform: scaleY(.25) } 50% { transform: scaleY(1.2) } }
    @keyframes k-tap         { 0%,100% { transform: scale(1) }    50% { transform: scale(1.18) } }
    @keyframes k-shutter     { 0%,88%,100% { opacity: 0 } 92%,96% { opacity: 1 } }
    @keyframes k-stagger-up  { 0%,15% { opacity: 0; transform: translateY(16px) }
                               30%,75% { opacity: 1; transform: translateY(0) }
                               92%,100% { opacity: 0; transform: translateY(-12px) } }
    @keyframes k-stagger-r   { 0%,15% { opacity: 0; transform: translateX(-12px) }
                               30%,80% { opacity: 1; transform: translateX(0) }
                               95%,100% { opacity: 0; transform: translateX(8px) } }
    @keyframes k-tilt        { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(22deg) } 100% { transform: rotate(0) } }
    @keyframes k-tilt-r      { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(-18deg) } 100% { transform: rotate(0) } }
    @keyframes k-sweep-x     { 0% { transform: translateX(0) } 100% { transform: translateX(var(--dx,40px)) } }
    @keyframes k-sweep-y     { 0% { transform: translateY(0) } 100% { transform: translateY(var(--dy,40px)) } }
    @keyframes k-bob         { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    @keyframes k-breath      { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
    @keyframes k-spin        { from { transform: rotate(0) } to { transform: rotate(360deg) } }
    @keyframes k-ripple      { 0% { opacity: 1; transform: scale(.3) } 100% { opacity: 0; transform: scale(2.3) } }
    @keyframes k-zoom-out    { 0% { opacity: 1; transform: scale(.2) } 100% { opacity: 0; transform: scale(1.6) } }
    @keyframes k-march       { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -40 } }
    @keyframes k-flow        { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -200 } }
    @keyframes k-shake       { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-3px) } 75% { transform: translateX(3px) } }
    @keyframes k-walkbar     { 0%,100% { transform: scaleX(0) } 50%,80% { transform: scaleX(1) } }
    @keyframes k-fill-l-to-r { 0% { transform: scaleX(0) } 100% { transform: scaleX(1) } }.s10 .err-bg { animation: k-pulse-soft 3.5s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
        .s10 .suggest { animation: k-stagger-up 3.5s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 1s; opacity: 0; }
        .s10 .pointer { animation: k-stagger-up 3.5s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 0.7s; opacity: 0; }</style><defs><radialGradient id="of3-vign" cx="50%" cy="55%" r="75%"><stop offset="55%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.45)"/></radialGradient><radialGradient id="of3-top" cx="50%" cy="0%" r="60%"><stop offset="0%" stop-color="rgba(214,222,224,0.05)"/><stop offset="100%" stop-color="rgba(214,222,224,0)"/></radialGradient><pattern id="of3-hatch" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" x2="0" y1="0" y2="16" stroke="rgba(255,255,255,0.024)" stroke-width="1"/></pattern></defs><rect width="1600" height="1200" fill="#181c22"/><rect width="1600" height="1200" fill="url(#of3-hatch)"/><rect width="1600" height="1200" fill="url(#of3-top)"/><rect width="1600" height="1200" fill="url(#of3-vign)"/><rect width="1598" height="1198" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/><g class="s10"><g transform="translate(80 160)"><rect width="1100" height="820" x="0" y="0" fill="#12151a" stroke="rgba(255,255,255,0.10)" stroke-width="2" rx="18"/><rect width="1100" height="48" x="0" y="0" fill="#0b0d10" rx="18"/><circle cx="24" cy="24" r="7" fill="#ff5f56"/><circle cx="46" cy="24" r="7" fill="#febc2e"/><circle cx="68" cy="24" r="7" fill="#28c840"/><g font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="22" transform="translate(36 100)"><text y="0" fill="#6ee2a1">$</text><text x="26" y="0" fill="#c4cad1">python train.py</text><text y="40" fill="#898f97">Traceback (most recent call last):</text><text y="76" fill="#898f97">  File &quot;train.py&quot;, line 47, in &lt;module&gt;</text><text y="112" fill="#898f97">    loss = criterion(output, target)</text><g><rect width="980" height="38" x="-12" y="130" fill="#ef7878" class="err-bg" opacity=".14" rx="6"/><text y="156" fill="#ef7878">RuntimeError: shape mismatch [32, 10] vs [32]</text></g><text y="220" fill="#585d64">  at training step 12 / 500</text><text y="320" fill="#6ee2a1">$</text><text x="26" y="320" fill="#898f97">_</text></g></g><g class="suggest" transform="translate(700 540)"><rect width="720" height="280" x="0" y="0" fill="#0b0d10" stroke="#d6dee0" stroke-width="2" rx="16"/><g transform="translate(24 30)"><circle cx="0" cy="0" r="8" fill="#d6dee0"/><text x="20" y="6" fill="#d6dee0" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" letter-spacing="3">LOCAL AI · suggestion</text></g><text x="24" y="92" fill="#f4f6f8" font-family="&quot;Geist&quot;,-apple-system,sans-serif" font-size="20">Looks like target is 1-D. Wrap it:</text><g transform="translate(24 124)"><rect width="660" height="60" x="0" y="0" fill="#181c22" stroke="rgba(255,255,255,0.06)" rx="8"/><text x="20" y="40" fill="#d6dee0" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="22">target.unsqueeze(1)</text></g><text x="24" y="234" fill="#585d64" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" letter-spacing="2">⏎  APPLY    ⌥⏎  EXPLAIN</text></g><path fill="none" stroke="#d6dee0" stroke-dasharray="6 6" stroke-width="2" d="m700 460 60 80" class="pointer"/></g></svg>