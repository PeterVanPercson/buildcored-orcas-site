<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" class="orcas-v3-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1600 1200"><style>@import url(&apos;/fonts.css&apos;);

    .orcas-v3-svg { display: block; width: 100%; height: 100%; }
    .orcas-v3-svg * { transform-box: fill-box; }

    /* ── motion primitives ──────────────────────────────────────── */
    @keyframes k-fade        { 0%,15%   { opacity: 0 } 30%,75% { opacity: 1 } 90%,100% { opacity: 0 } }
    @keyframes k-fade-in     { 0%       { opacity: 0 } 35%,100% { opacity: 1 } }
    @keyframes k-fade-loop   { 0%,30%   { opacity: 0 } 50%,80% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes k-blink       { 0%,90%,100% { opacity: 1 } 95% { opacity: 0 } }
    @keyframes k-cursor      { 0%,49%   { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes k-pulse       { 0%,100%  { opacity: .25 } 50% { opacity: 1 } }
    @keyframes k-pulse-soft  { 0%,100%  { opacity: .5  } 50% { opacity: 1 } }
    @keyframes k-glow        { 0%,100%  { opacity: .15 } 50% { opacity: .9 } }
    @keyframes k-trace       { 0% { stroke-dashoffset: var(--len,1000) } 60%,100% { stroke-dashoffset: 0 } }
    @keyframes k-trace-loop  { 0%   { stroke-dashoffset: var(--len,1000); opacity: 1 }
                               55%  { stroke-dashoffset: 0; opacity: 1 }
                               92%  { opacity: 1 }
                               100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes k-amp         { 0%,100% { transform: scaleY(.25) } 50% { transform: scaleY(1.2) } }
    @keyframes k-tap         { 0%,100% { transform: scale(1) }    50% { transform: scale(1.18) } }
    @keyframes k-shutter     { 0%,88%,100% { opacity: 0 } 92%,96% { opacity: 1 } }
    @keyframes k-stagger-up  { 0%,15% { opacity: 0; transform: translateY(16px) }
                               30%,75% { opacity: 1; transform: translateY(0) }
                               92%,100% { opacity: 0; transform: translateY(-12px) } }
    @keyframes k-stagger-r   { 0%,15% { opacity: 0; transform: translateX(-12px) }
                               30%,80% { opacity: 1; transform: translateX(0) }
                               95%,100% { opacity: 0; transform: translateX(8px) } }
    @keyframes k-tilt        { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(22deg) } 100% { transform: rotate(0) } }
    @keyframes k-tilt-r      { 0%,30% { transform: rotate(0) } 50%,80% { transform: rotate(-18deg) } 100% { transform: rotate(0) } }
    @keyframes k-sweep-x     { 0% { transform: translateX(0) } 100% { transform: translateX(var(--dx,40px)) } }
    @keyframes k-sweep-y     { 0% { transform: translateY(0) } 100% { transform: translateY(var(--dy,40px)) } }
    @keyframes k-bob         { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    @keyframes k-breath      { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
    @keyframes k-spin        { from { transform: rotate(0) } to { transform: rotate(360deg) } }
    @keyframes k-ripple      { 0% { opacity: 1; transform: scale(.3) } 100% { opacity: 0; transform: scale(2.3) } }
    @keyframes k-zoom-out    { 0% { opacity: 1; transform: scale(.2) } 100% { opacity: 0; transform: scale(1.6) } }
    @keyframes k-march       { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -40 } }
    @keyframes k-flow        { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -200 } }
    @keyframes k-shake       { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-3px) } 75% { transform: translateX(3px) } }
    @keyframes k-walkbar     { 0%,100% { transform: scaleX(0) } 50%,80% { transform: scaleX(1) } }
    @keyframes k-fill-l-to-r { 0% { transform: scaleX(0) } 100% { transform: scaleX(1) } }.s29 .step1 { animation: s29-pop 5s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 0.0s; transform-origin: 50% 50%; }
        .s29 .step2 { animation: s29-pop 5s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 1.2s; transform-origin: 50% 50%; }
        .s29 .step3 { animation: s29-pop 5s cubic-bezier(0.16, 1, 0.3, 1) infinite; animation-delay: 2.4s; transform-origin: 50% 50%; }
        @keyframes s29-pop { 0%, 15% { transform: scale(0.96); filter: brightness(0.55) } 25%, 45% { transform: scale(1); filter: brightness(1.05) } 60%, 100% { transform: scale(0.96); filter: brightness(0.55) } }
        .s29 .arrow { animation: k-flow 1.4s linear infinite; }
        .s29 .speak-bar { animation: k-amp 0.7s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate; transform-origin: 50% 100%; }</style><defs><radialGradient id="of3-vign" cx="50%" cy="55%" r="75%"><stop offset="55%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.45)"/></radialGradient><radialGradient id="of3-top" cx="50%" cy="0%" r="60%"><stop offset="0%" stop-color="rgba(214,222,224,0.05)"/><stop offset="100%" stop-color="rgba(214,222,224,0)"/></radialGradient><pattern id="of3-hatch" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" x2="0" y1="0" y2="16" stroke="rgba(255,255,255,0.024)" stroke-width="1"/></pattern></defs><rect width="1600" height="1200" fill="#181c22"/><rect width="1600" height="1200" fill="url(#of3-hatch)"/><rect width="1600" height="1200" fill="url(#of3-top)"/><rect width="1600" height="1200" fill="url(#of3-vign)"/><rect width="1598" height="1198" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/><g class="s29"><g transform="translate(80 120)"><circle cx="0" cy="0" r="6" fill="#d6dee0"/><text x="20" y="6" fill="#898f97" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="20" letter-spacing="3">PIPELINE</text></g><g transform="translate(80 300)"><g class="step1"><rect width="380" height="500" x="0" y="0" fill="#12151a" stroke="#d6dee0" stroke-width="2" rx="18"/><text x="30" y="50" fill="#d6dee0" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" letter-spacing="3">01 · VISION</text><rect width="320" height="240" x="30" y="80" fill="#0b0d10" stroke="rgba(255,255,255,0.10)" rx="10"/><circle cx="190" cy="180" r="42" fill="#363a40"/><ellipse cx="190" cy="280" fill="#363a40" rx="100" ry="40"/><text x="30" y="380" fill="#c4cad1" font-family="&quot;Geist&quot;,-apple-system,sans-serif" font-size="22">frame · 30 fps</text><text x="30" y="412" fill="#c4cad1" font-family="&quot;Geist&quot;,-apple-system,sans-serif" font-size="22">person + cup</text></g><path fill="none" stroke="#d6dee0" stroke-dasharray="14 10" stroke-width="4" d="M400 250h120" class="arrow"/><path fill="none" stroke="#d6dee0" stroke-width="4" d="m515 245 10 5-10 5"/><g class="step2" transform="translate(540)"><rect width="380" height="500" x="0" y="0" fill="#12151a" stroke="#d6dee0" stroke-width="2" rx="18"/><text x="30" y="50" fill="#d6dee0" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" letter-spacing="3">02 · REASON</text><g transform="translate(190 200)"><circle cx="0" cy="0" r="100" fill="none" stroke="#d6dee0" stroke-width="3"/><circle cx="0" cy="0" r="60" fill="none" stroke="#d6dee0" stroke-width="3" opacity=".6"/><circle cx="0" cy="0" r="28" fill="#d6dee0"/><line x1="0" x2="0" y1="0" y2="-100" stroke="#d6dee0" stroke-width="1.5" opacity=".45"/><line x1="0" x2="0" y1="0" y2="-100" stroke="#d6dee0" stroke-width="1.5" opacity=".45" transform="rotate(60)"/><line x1="0" x2="0" y1="0" y2="-100" stroke="#d6dee0" stroke-width="1.5" opacity=".45" transform="rotate(120)"/><line x1="0" x2="0" y1="0" y2="-100" stroke="#d6dee0" stroke-width="1.5" opacity=".45" transform="rotate(180)"/><line x1="0" x2="0" y1="0" y2="-100" stroke="#d6dee0" stroke-width="1.5" opacity=".45" transform="rotate(240)"/><line x1="0" x2="0" y1="0" y2="-100" stroke="#d6dee0" stroke-width="1.5" opacity=".45" transform="rotate(300)"/></g><text x="30" y="380" fill="#c4cad1" font-family="&quot;Geist&quot;,-apple-system,sans-serif" font-size="22">“Refill your coffee?</text><text x="30" y="412" fill="#c4cad1" font-family="&quot;Geist&quot;,-apple-system,sans-serif" font-size="22">It&apos;s been 2 hours.”</text></g><path fill="none" stroke="#d6dee0" stroke-dasharray="14 10" stroke-width="4" d="M940 250h120" class="arrow"/><path fill="none" stroke="#d6dee0" stroke-width="4" d="m1055 245 10 5-10 5"/><g class="step3" transform="translate(1080)"><rect width="360" height="500" x="0" y="0" fill="#12151a" stroke="#d6dee0" stroke-width="2" rx="18"/><text x="30" y="50" fill="#d6dee0" font-family="&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace" font-size="14" letter-spacing="3">03 · SPEAK</text><g transform="translate(180 220)"><path fill="#d6dee0" d="M-50-40h40l40-40V80l-40-40h-40Z"/><path fill="none" stroke="#d6dee0" stroke-width="5" d="M50-40a40 40 0 0 1 0 80"/><path fill="none" stroke="#d6dee0" stroke-width="5" d="M80-60a60 60 0 0 1 0 120" opacity=".6"/></g><g transform="translate(60 410)"><rect width="14" height="60" x="0" y="-60" fill="#d6dee0" class="speak-bar" rx="4" style="animation-delay:0s;transform-origin:7px 0px"/><rect width="14" height="60" x="22" y="-60" fill="#d6dee0" class="speak-bar" rx="4" style="animation-delay:0.05s;transform-origin:29px 0px"/><rect width="14" height="60" x="44" y="-60" fill="#d6dee0" class="speak-bar" rx="4" style="animation-delay:0.1s;transform-origin:51px 0px"/><rect width="14" height="60" x="66" y="-60" fill="#d6dee0" class="speak-bar" rx="4" style="animation-delay:0.15s;transform-origin:73px 0px"/><rect width="14" height="60" x="88" y="-60" fill="#d6dee0" class="speak-bar" rx="4" style="animation-delay:0.2s;transform-origin:95px 0px"/><rect width="14" height="60" x="110" y="-60" fill="#d6dee0" class="speak-bar" rx="4" style="animation-delay:0.25s;transform-origin:117px 0px"/><rect width="14" height="60" x="132" y="-60" fill="#d6dee0" class="speak-bar" rx="4" style="animation-delay:0.3s;transform-origin:139px 0px"/><rect width="14" height="60" x="154" y="-60" fill="#d6dee0" class="speak-bar" rx="4" style="animation-delay:0.35s;transform-origin:161px 0px"/><rect width="14" height="60" x="176" y="-60" fill="#d6dee0" class="speak-bar" rx="4" style="animation-delay:0.4s;transform-origin:183px 0px"/><rect width="14" height="60" x="198" y="-60" fill="#d6dee0" class="speak-bar" rx="4" style="animation-delay:0.45s;transform-origin:205px 0px"/><rect width="14" height="60" x="220" y="-60" fill="#d6dee0" class="speak-bar" rx="4" style="animation-delay:0.5s;transform-origin:227px 0px"/><rect width="14" height="60" x="242" y="-60" fill="#d6dee0" class="speak-bar" rx="4" style="animation-delay:0.55s;transform-origin:249px 0px"/></g></g></g></g></svg>